<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B57F0"/>
      <stop offset="1" stop-color="#2B278F"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECEDF6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#14124A" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px rounded square centred on a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- the page -->
  <g filter="url(#shadow)" transform="rotate(-4 512 520)">
    <path d="M300 220 H630 L724 314 V804 Q724 830 698 830 H326 Q300 830 300 804 Z" fill="url(#sheet)"/>
    <path d="M630 220 V292 Q630 314 652 314 H724 Z" fill="#CFD1E6"/>
    <!-- heading -->
    <rect x="360" y="300" width="190" height="34" rx="10" fill="#2B278F"/>
    <!-- text lines -->
    <rect x="360" y="380" width="300" height="20" rx="10" fill="#C3C6DA"/>
    <rect x="360" y="424" width="260" height="20" rx="10" fill="#C3C6DA"/>
    <!-- added line: green highlight with a margin bar -->
    <rect x="330" y="470" width="8" height="64" rx="4" fill="#1F9D55"/>
    <rect x="352" y="474" width="320" height="56" rx="14" fill="#D4F3DF"/>
    <rect x="368" y="492" width="248" height="20" rx="10" fill="#1F9D55"/>
    <!-- removed line: struck through -->
    <rect x="330" y="560" width="8" height="52" rx="4" fill="#D64545"/>
    <rect x="360" y="576" width="240" height="20" rx="10" fill="#F2C4C4"/>
    <rect x="356" y="583" width="248" height="6" rx="3" fill="#D64545"/>
    <!-- more text -->
    <rect x="360" y="640" width="290" height="20" rx="10" fill="#C3C6DA"/>
    <rect x="360" y="684" width="210" height="20" rx="10" fill="#C3C6DA"/>
    <rect x="360" y="728" width="250" height="20" rx="10" fill="#C3C6DA"/>
  </g>
</svg>
