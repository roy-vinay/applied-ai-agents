<svg xmlns="http://www.w3.org/2000/svg" width="839" height="974" viewBox="0 0 839 974" role="img" aria-label="Terminal demo of mdeditdiff: a planner agent, a person and an implementer agent share plan.md, and the implementer asks what changed">
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;fill:#d7dae0;white-space:pre}
.say{fill:#56b6c2;font-weight:700}.cmd{fill:#8b93a1}.add{fill:#98c379}.del{fill:#e06c75}.mod{fill:#e5c07b}
</style>
<rect width="839" height="974" rx="10" fill="#1e2127"/>
<circle cx="20" cy="18" r="6" fill="#ff5f57"/><circle cx="40" cy="18" r="6" fill="#febc2e"/><circle cx="60" cy="18" r="6" fill="#28c840"/>
<style>@keyframes l0{0%,2.63%{opacity:0}3.43%,98%{opacity:1}100%{opacity:0}}.l0{animation:l0 22.8s linear infinite;opacity:0}</style>
<text x="18" y="58" class="l0 " xml:space="preserve"></text>
<style>@keyframes l1{0%,9.94%{opacity:0}10.74%,98%{opacity:1}100%{opacity:0}}.l1{animation:l1 22.8s linear infinite;opacity:0}</style>
<text x="18" y="77" class="l1 say" xml:space="preserve"># 1. A planner agent writes plan.md and checks it in.</text>
<style>@keyframes l2{0%,10.25%{opacity:0}11.05%,98%{opacity:1}100%{opacity:0}}.l2{animation:l2 22.8s linear infinite;opacity:0}</style>
<text x="18" y="96" class="l2 cmd" xml:space="preserve">$ mdeditdiff checkpoint plan.md --author planner --note &quot;First plan&quot;</text>
<style>@keyframes l3{0%,11.78%{opacity:0}12.58%,98%{opacity:1}100%{opacity:0}}.l3{animation:l3 22.8s linear infinite;opacity:0}</style>
<text x="18" y="115" class="l3 " xml:space="preserve">r1: Recorded a new revision with your name.</text>
<style>@keyframes l4{0%,12.08%{opacity:0}12.88%,98%{opacity:1}100%{opacity:0}}.l4{animation:l4 22.8s linear infinite;opacity:0}</style>
<text x="18" y="134" class="l4 " xml:space="preserve"></text>
<style>@keyframes l5{0%,19.40%{opacity:0}20.20%,98%{opacity:1}100%{opacity:0}}.l5{animation:l5 22.8s linear infinite;opacity:0}</style>
<text x="18" y="153" class="l5 say" xml:space="preserve"># 2. An implementer agent reads it for the first time (it gets the full text once).</text>
<style>@keyframes l6{0%,19.70%{opacity:0}20.50%,98%{opacity:1}100%{opacity:0}}.l6{animation:l6 22.8s linear infinite;opacity:0}</style>
<text x="18" y="172" class="l6 cmd" xml:space="preserve">$ mdeditdiff changes plan.md --reader implementer</text>
<style>@keyframes l7{0%,21.23%{opacity:0}22.03%,98%{opacity:1}100%{opacity:0}}.l7{animation:l7 22.8s linear infinite;opacity:0}</style>
<text x="18" y="191" class="l7 " xml:space="preserve">plan.md: first look for reader &quot;implementer&quot;. Full text of r1 follows. Marked as seen.</text>
<style>@keyframes l8{0%,21.54%{opacity:0}22.34%,98%{opacity:1}100%{opacity:0}}.l8{animation:l8 22.8s linear infinite;opacity:0}</style>
<text x="18" y="210" class="l8 " xml:space="preserve"></text>
<style>@keyframes l9{0%,21.85%{opacity:0}22.65%,98%{opacity:1}100%{opacity:0}}.l9{animation:l9 22.8s linear infinite;opacity:0}</style>
<text x="18" y="229" class="l9 " xml:space="preserve"># Export reports to CSV</text>
<style>@keyframes l10{0%,22.15%{opacity:0}22.95%,98%{opacity:1}100%{opacity:0}}.l10{animation:l10 22.8s linear infinite;opacity:0}</style>
<text x="18" y="248" class="l10 " xml:space="preserve">   ...</text>
<style>@keyframes l11{0%,22.46%{opacity:0}23.26%,98%{opacity:1}100%{opacity:0}}.l11{animation:l11 22.8s linear infinite;opacity:0}</style>
<text x="18" y="267" class="l11 " xml:space="preserve"></text>
<style>@keyframes l12{0%,29.77%{opacity:0}30.57%,98%{opacity:1}100%{opacity:0}}.l12{animation:l12 22.8s linear infinite;opacity:0}</style>
<text x="18" y="286" class="l12 say" xml:space="preserve"># 3. A person edits the plan in their editor and tells no one.</text>
<style>@keyframes l13{0%,30.08%{opacity:0}30.88%,98%{opacity:1}100%{opacity:0}}.l13{animation:l13 22.8s linear infinite;opacity:0}</style>
<text x="18" y="305" class="l13 " xml:space="preserve">   - answers the archived-rows question and removes it</text>
<style>@keyframes l14{0%,30.39%{opacity:0}31.19%,98%{opacity:1}100%{opacity:0}}.l14{animation:l14 22.8s linear infinite;opacity:0}</style>
<text x="18" y="324" class="l14 " xml:space="preserve">   - tightens step 2</text>
<style>@keyframes l15{0%,30.69%{opacity:0}31.49%,98%{opacity:1}100%{opacity:0}}.l15{animation:l15 22.8s linear infinite;opacity:0}</style>
<text x="18" y="343" class="l15 " xml:space="preserve"></text>
<style>@keyframes l16{0%,38.00%{opacity:0}38.80%,98%{opacity:1}100%{opacity:0}}.l16{animation:l16 22.8s linear infinite;opacity:0}</style>
<text x="18" y="362" class="l16 say" xml:space="preserve"># 4. The planner checks what changed before revising, then proposes a row limit and checks in.</text>
<style>@keyframes l17{0%,38.31%{opacity:0}39.11%,98%{opacity:1}100%{opacity:0}}.l17{animation:l17 22.8s linear infinite;opacity:0}</style>
<text x="18" y="381" class="l17 cmd" xml:space="preserve">$ mdeditdiff changes plan.md --reader planner</text>
<style>@keyframes l18{0%,39.84%{opacity:0}40.64%,98%{opacity:1}100%{opacity:0}}.l18{animation:l18 22.8s linear infinite;opacity:0}</style>
<text x="18" y="400" class="l18 " xml:space="preserve">plan.md: 3 changes (1 modified, 1 added, 1 removed) since r1, your last look, up to r2. Marked as seen.</text>
<style>@keyframes l19{0%,40.15%{opacity:0}40.95%,98%{opacity:1}100%{opacity:0}}.l19{animation:l19 22.8s linear infinite;opacity:0}</style>
<text x="18" y="419" class="l19 " xml:space="preserve">By: r2 changed outside, not reported</text>
<style>@keyframes l20{0%,40.46%{opacity:0}41.26%,98%{opacity:1}100%{opacity:0}}.l20{animation:l20 22.8s linear infinite;opacity:0}</style>
<text x="18" y="438" class="l20 cmd" xml:space="preserve">$ mdeditdiff checkpoint plan.md --author planner --note &quot;Proposed a row limit&quot;</text>
<style>@keyframes l21{0%,41.99%{opacity:0}42.79%,98%{opacity:1}100%{opacity:0}}.l21{animation:l21 22.8s linear infinite;opacity:0}</style>
<text x="18" y="457" class="l21 " xml:space="preserve">r3: Recorded a new revision with your name.</text>
<style>@keyframes l22{0%,42.29%{opacity:0}43.09%,98%{opacity:1}100%{opacity:0}}.l22{animation:l22 22.8s linear infinite;opacity:0}</style>
<text x="18" y="476" class="l22 " xml:space="preserve"></text>
<style>@keyframes l23{0%,49.61%{opacity:0}50.41%,98%{opacity:1}100%{opacity:0}}.l23{animation:l23 22.8s linear infinite;opacity:0}</style>
<text x="18" y="495" class="l23 say" xml:space="preserve"># 5. The implementer comes back. Instead of re-reading the plan, it asks what changed:</text>
<style>@keyframes l24{0%,49.91%{opacity:0}50.71%,98%{opacity:1}100%{opacity:0}}.l24{animation:l24 22.8s linear infinite;opacity:0}</style>
<text x="18" y="514" class="l24 cmd" xml:space="preserve">$ mdeditdiff changes plan.md --reader implementer</text>
<style>@keyframes l25{0%,51.44%{opacity:0}52.24%,98%{opacity:1}100%{opacity:0}}.l25{animation:l25 22.8s linear infinite;opacity:0}</style>
<text x="18" y="533" class="l25 " xml:space="preserve">plan.md: 4 changes (2 modified, 1 added, 1 removed) since r1, your last look, up to r3. Marked as seen.</text>
<style>@keyframes l26{0%,51.75%{opacity:0}52.55%,98%{opacity:1}100%{opacity:0}}.l26{animation:l26 22.8s linear infinite;opacity:0}</style>
<text x="18" y="552" class="l26 " xml:space="preserve">By: r2 changed outside, not reported; r3 planner: &quot;Proposed a row limit&quot;</text>
<style>@keyframes l27{0%,52.06%{opacity:0}52.86%,98%{opacity:1}100%{opacity:0}}.l27{animation:l27 22.8s linear infinite;opacity:0}</style>
<text x="18" y="571" class="l27 " xml:space="preserve">Word changes are shown as [-removed-] {+added+}.</text>
<style>@keyframes l28{0%,52.36%{opacity:0}53.16%,98%{opacity:1}100%{opacity:0}}.l28{animation:l28 22.8s linear infinite;opacity:0}</style>
<text x="18" y="590" class="l28 " xml:space="preserve"></text>
<style>@keyframes l29{0%,52.67%{opacity:0}53.47%,98%{opacity:1}100%{opacity:0}}.l29{animation:l29 22.8s linear infinite;opacity:0}</style>
<text x="18" y="609" class="l29 mod" xml:space="preserve">~ modified Export reports to CSV &gt; Steps (list-item, line 8)</text>
<style>@keyframes l30{0%,52.98%{opacity:0}53.78%,98%{opacity:1}100%{opacity:0}}.l30{animation:l30 22.8s linear infinite;opacity:0}</style>
<text x="18" y="628" class="l30 " xml:space="preserve">    Build the CSV on the server{+, streaming rows so large reports never time out+}.</text>
<style>@keyframes l31{0%,53.28%{opacity:0}54.08%,98%{opacity:1}100%{opacity:0}}.l31{animation:l31 22.8s linear infinite;opacity:0}</style>
<text x="18" y="647" class="l31 del" xml:space="preserve">- removed  Export reports to CSV &gt; Open questions (list-item, was line 14)</text>
<style>@keyframes l32{0%,53.59%{opacity:0}54.39%,98%{opacity:1}100%{opacity:0}}.l32{animation:l32 22.8s linear infinite;opacity:0}</style>
<text x="18" y="666" class="l32 " xml:space="preserve">    - Should exports include archived rows?</text>
<style>@keyframes l33{0%,53.90%{opacity:0}54.70%,98%{opacity:1}100%{opacity:0}}.l33{animation:l33 22.8s linear infinite;opacity:0}</style>
<text x="18" y="685" class="l33 mod" xml:space="preserve">~ modified Export reports to CSV &gt; Open questions (list-item, line 14)</text>
<style>@keyframes l34{0%,54.20%{opacity:0}55.00%,98%{opacity:1}100%{opacity:0}}.l34{animation:l34 22.8s linear infinite;opacity:0}</style>
<text x="18" y="704" class="l34 " xml:space="preserve">    What is the row limit? {+Proposed: 100,000 rows.+}</text>
<style>@keyframes l35{0%,54.51%{opacity:0}55.31%,98%{opacity:1}100%{opacity:0}}.l35{animation:l35 22.8s linear infinite;opacity:0}</style>
<text x="18" y="723" class="l35 add" xml:space="preserve">+ added    Export reports to CSV &gt; Open questions (paragraph, line 16)</text>
<style>@keyframes l36{0%,54.82%{opacity:0}55.62%,98%{opacity:1}100%{opacity:0}}.l36{animation:l36 22.8s linear infinite;opacity:0}</style>
<text x="18" y="742" class="l36 " xml:space="preserve">    Decision: archived rows are excluded.</text>
<style>@keyframes l37{0%,55.12%{opacity:0}55.92%,98%{opacity:1}100%{opacity:0}}.l37{animation:l37 22.8s linear infinite;opacity:0}</style>
<text x="18" y="761" class="l37 " xml:space="preserve"></text>
<style>@keyframes l38{0%,62.43%{opacity:0}63.23%,98%{opacity:1}100%{opacity:0}}.l38{animation:l38 22.8s linear infinite;opacity:0}</style>
<text x="18" y="780" class="l38 say" xml:space="preserve"># 6. The full history, with who reported each version and where each reader last looked:</text>
<style>@keyframes l39{0%,62.74%{opacity:0}63.54%,98%{opacity:1}100%{opacity:0}}.l39{animation:l39 22.8s linear infinite;opacity:0}</style>
<text x="18" y="799" class="l39 cmd" xml:space="preserve">$ mdeditdiff history plan.md</text>
<style>@keyframes l40{0%,64.27%{opacity:0}65.07%,98%{opacity:1}100%{opacity:0}}.l40{animation:l40 22.8s linear infinite;opacity:0}</style>
<text x="18" y="818" class="l40 " xml:space="preserve">plan.md: 3 revisions, newest first.</text>
<style>@keyframes l41{0%,64.58%{opacity:0}65.38%,98%{opacity:1}100%{opacity:0}}.l41{animation:l41 22.8s linear infinite;opacity:0}</style>
<text x="18" y="837" class="l41 " xml:space="preserve">r3  2026-10-16T05:40:59.773Z  planner: &quot;Proposed a row limit&quot;</text>
<style>@keyframes l42{0%,64.89%{opacity:0}65.69%,98%{opacity:1}100%{opacity:0}}.l42{animation:l42 22.8s linear infinite;opacity:0}</style>
<text x="18" y="856" class="l42 " xml:space="preserve">r2  2026-10-16T05:40:59.672Z  changed outside, not reported</text>
<style>@keyframes l43{0%,65.19%{opacity:0}65.99%,98%{opacity:1}100%{opacity:0}}.l43{animation:l43 22.8s linear infinite;opacity:0}</style>
<text x="18" y="875" class="l43 " xml:space="preserve">r1  2026-10-16T05:40:59.521Z  planner: &quot;First plan&quot;</text>
<style>@keyframes l44{0%,65.50%{opacity:0}66.30%,98%{opacity:1}100%{opacity:0}}.l44{animation:l44 22.8s linear infinite;opacity:0}</style>
<text x="18" y="894" class="l44 " xml:space="preserve"></text>
<style>@keyframes l45{0%,65.81%{opacity:0}66.61%,98%{opacity:1}100%{opacity:0}}.l45{animation:l45 22.8s linear infinite;opacity:0}</style>
<text x="18" y="913" class="l45 " xml:space="preserve">Last looked: planner at r3, implementer at r3</text>
<style>@keyframes l46{0%,66.11%{opacity:0}66.91%,98%{opacity:1}100%{opacity:0}}.l46{animation:l46 22.8s linear infinite;opacity:0}</style>
<text x="18" y="932" class="l46 " xml:space="preserve"></text>
<style>@keyframes l47{0%,73.42%{opacity:0}74.22%,98%{opacity:1}100%{opacity:0}}.l47{animation:l47 22.8s linear infinite;opacity:0}</style>
<text x="18" y="951" class="l47 say" xml:space="preserve"># Done. The demo ran in a temporary folder and did not touch your real history.</text>
</svg>
