document.addEventListener("click",e=>{const t=e.target.closest("[data-togglewhy],[data-preason],[data-agents],[data-mem],[data-teachopt],[data-remember],[data-stopauto],[data-autonomy],[data-golive],[data-awf],[data-await],[data-runnow],[data-wiz],[data-caltoggle],[data-calday],[data-page],[data-showme],[data-open],[data-review],[data-nudge],[data-expand],[data-close],[data-resolve],[data-opt],[data-dfix],[data-dapprove],[data-dpin],[data-pincancel],[data-pinpost],[data-reply],[data-starter],[data-scroll],[data-pinarea]");if(!t)return;const d=t.dataset;
 if(d.pinarea!==undefined&&!e.target.closest(".pinbox")){const r=t.getBoundingClientRect();S.pendingPin={x:Math.round((e.clientX-r.left)/r.width*100),y:Math.round((e.clientY-r.top)/r.height*100)};renderDrawer();return;}
 if(d.awf){S.awFilter=d.awf==="all"?null:+d.awf;S.pg=S.pg||{};S.pg.agent=0;updateHome();return;}
 if(d.await){openPending(d.await);return;}
 if(d.togglewhy){S.showWhy=!S.showWhy;if(S.showWhy)S.flags.why=true;renderDrawer();return;}
 if(d.preason){S.pinReason=d.preason;const v=$("pinInput")?$("pinInput").value:"";renderDrawer();if($("pinInput")){$("pinInput").value=v;$("pinInput").focus();}return;}
 if(d.agents){openAgents();return;}
 if(d.mem){const [r,i,act]=d.mem.split(":");const m=S.amem[r][+i];const ag=AGENTS.find(a=>a.r===r);if(act==="propose"){m.status="proposed";S.R.log.unshift({t:fmtClk(CLK+=1),who:OWNERS[S.viewAs].n,x:`Proposed a brand rule from the ${r}: “${m.x}”`});toast("Proposed to Jordan Kim (Brand). It becomes a rule only when Jordan approves.");}else if(act==="rule"){if(S.viewAs!=="jordan"){toast("Only the brand owner can approve brand rules. Switch “Viewing as” to Jordan.");return;}m.status="rule";S.R.log.unshift({t:fmtClk(CLK+=1),who:"Jordan Kim",x:`Approved a brand rule: “${m.x}”`});toast(`Jordan approved it as a brand rule: ${m.x}`);}else{if(ag&&typeof canEdit==="function"&&!canEdit(ag)){toast("Only the agent’s owner can retire its lessons.");return;}if(window.PY&&m.pyId)PY.retire(m.pyId);S.amem[r].splice(+i,1);toast("Retired. The agent will stop using it.");if(S.gsel===m.id)S.gsel=null;}if(S.view!=="home")rerenderPage();else renderDrawer();return;}
 if(d.teachopt){S.teachAgent=d.teachopt==="agent";renderDrawer();return;}
 if(d.remember){const c=byId(d.remember);teach("Planner",{x:c.rememberText,src:"Brielle · Marketing",when:"today",scope:c.rememberScope});c.rememberText=null;renderDrawer();return;}
 if(d.stopauto){const c=byId(d.stopauto);c.autoAt=null;c.autoPick=null;renderDrawer();updateHome();return;}
 if(d.autonomy){closeDrawer();go("rules");return;}
 if(d.golive){const c=byId(d.golive);c.stage=5;c.next="live, published from your scheduler";hist(c,"Live",`went live ${c.launch} at 9:00 from the scheduled package (simulated)`);toast(`${c.name} is live`);updateHome();return;}
 if(d.runnow){const c=byId(d.runnow);closeDrawer();hist(c,"Plan","Brielle started the scheduled build early");runAgent(c,[["Building v2 in 5 formats",2,"agent built v2 in 5 formats",{v:"v2",score:6,note:"Built early on request"}]],()=>{c.stage=3;c.owner="dana";c.since="just now";c.task="Dana is reviewing the youth savings ads";c.dueBy="Thu Nov 12";c.nudged="Not nudged";c.auto="Agent nudges if it’s still open the day it’s due";c.next="ask you to schedule the Mon Nov 16 launch";hist(c,"Review","sent to Dana (Legal), due Thu Nov 12");});updateHome();return;}
 if(d.open){openNeed(d.open);return;}if(d.review){openReview(d.review);return;}if(d.nudge){nudge(d.nudge,d.anyway);return;}
 if(d.expand){S.expanded=S.expanded===d.expand?null:d.expand;S.flags.history=true;updateHome();return;}
 if(d.close){closeDrawer();return;}if(d.resolve){resolve(d.resolve);return;}
 if(d.opt){const c=byId(S.drawer);c.sel=+d.opt;renderDrawer();return;}
 if(d.caltoggle){S.calOpen=S.calOpen===d.caltoggle?null:d.caltoggle;if(d.caltoggle==="hero")updateHome();else if(d.caltoggle==="wizc")updateHero();else renderDrawer();return;}
 if(d.calday){const [ctx,n]=d.calday.split(":");if(ctx==="wiz"){S.wiz.date=dstr(+n);if(S.calOpen==="wizc")S.calOpen=null;updateHero();}else if(ctx==="hero"){S.launchSel=dstr(+n);S.calOpen=null;updateHome();}else{const c=byId(S.drawer);c.plan.launch=dstr(+n);S.calOpen=null;renderDrawer();}return;}
 if(d.dfix){danaFix(d.dfix);return;}if(d.dapprove){danaApprove(d.dapprove);return;}
 if(d.dpin){S.pendingPin={x:60,y:52};renderDrawer();return;}if(d.pincancel){S.pendingPin=null;renderDrawer();return;}if(d.pinpost){postPin();return;}
 if(d.reply){sendReply();return;}if(d.starter){const k=d.starter;S.wiz={step:2,text:SCEN[k].brief,date:SCEN[k].launch||"Fri Nov 6",scen:k};updateHero();return;}
 if(d.wiz){const W=S.wiz;S.calOpen=null;if(d.wiz==="next")W.step=W.step===1&&W.date?3:Math.min(3,W.step+1);else if(d.wiz==="edit")W.step=1;else if(d.wiz==="back")W.step=Math.max(1,W.step-1);else if(d.wiz==="start"){start();return;}updateHero();return;}
 if(d.showme){const el=$(d.showme);if(el)el.scrollIntoView({behavior:"smooth",block:"center"});return;}
 if(d.page){const [k,v]=d.page.split(":");S.pg=S.pg||{};S.pg[k]=v.startsWith("=")?+v.slice(1):(S.pg[k]||0)+ +v;updateHome();return;}
 if(d.scroll){const [id,dir]=d.scroll.split(":");$(id).scrollBy({left:+dir*320,behavior:"smooth"});return;}});
document.addEventListener("click",e=>{const a=e.target.closest("[data-auto],[data-aclose]");if(a){if(a.dataset.aclose){$("modalRoot").innerHTML="";return;}const [k,v]=a.dataset.auto.split(":");S.auto[k]=v==="true";if(k==="pick")armAuto();autonomyModal();updateHome();return;}const t=e.target.closest("[data-ch],[data-cclose],[data-csend]");if(!t)return;const d=t.dataset;if(d.ch){S.composer.ch=d.ch;renderComposer();}else if(d.cclose){S.composer=null;renderComposer();}else if(d.csend)sendNudge();});
