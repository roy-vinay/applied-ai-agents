<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brand Review: live, running the agent code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F4F7;--panel:#FFFFFF;--ink:#14171C;--muted:#5A6270;--line:#E2E5EA;--soft:#F6F7F9;--accent:#2F5BEA;--accent-ink:#FFFFFF;--accent-soft:#E8EDFC;--accent-strong:#1E3FB0;--ok:#1F7A4D;--ok-soft:#E3F4EA;--you:#8A5300;--you-dot:#C27A00;--you-soft:#FFF3D6;--rev:#7A4BC2;--rev-soft:#F2ECFB;--risk:#B42318;--risk-soft:#FDECEA;--rail:#15191F;--rail-ink:#C3C9D3;--canvas:#ECEEF2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1216;--panel:#181C23;--ink:#E7EAEF;--muted:#9AA4B2;--line:#2A313C;--soft:#1F2530;--accent:#6F95FF;--accent-ink:#0B1020;--accent-soft:#1E2A47;--accent-strong:#A9C0FF;--ok:#4CC38A;--ok-soft:#16301F;--you:#F2B04A;--you-dot:#F2B04A;--you-soft:#33270F;--rev:#B596F0;--rev-soft:#2A2140;--risk:#FF8A7A;--risk-soft:#3A1A17;--rail:#0B0D11;--rail-ink:#AEB6C2;--canvas:#141820;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1216;--panel:#181C23;--ink:#E7EAEF;--muted:#9AA4B2;--line:#2A313C;--soft:#1F2530;--accent:#6F95FF;--accent-ink:#0B1020;--accent-soft:#1E2A47;--accent-strong:#A9C0FF;--ok:#4CC38A;--ok-soft:#16301F;--you:#F2B04A;--you-dot:#F2B04A;--you-soft:#33270F;--rev:#B596F0;--rev-soft:#2A2140;--risk:#FF8A7A;--risk-soft:#3A1A17;--rail:#0B0D11;--rail-ink:#AEB6C2;--canvas:#141820;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:14px;line-height:1.45}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;min-height:100vh}
.rail{width:220px;flex:none;background:var(--rail);color:var(--rail-ink);padding:14px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{width:28px;height:28px;border-radius:7px;background:#2F5BEA;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.nav{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;color:var(--rail-ink);background:none;border:0;text-align:left;width:100%;font-size:14px;transition:background .15s,color .15s;position:relative}
.nav:not([disabled]):hover{background:#222833;color:#fff}
.nav.on{background:linear-gradient(90deg,#2F5BEA33,#2A303A);color:#fff;font-weight:600}.nav.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:#6F95FF}.nav.on svg{color:#9DB6FF}
.nav[disabled]{opacity:.4;cursor:default}.nav:focus{outline:none}.nav:focus-visible{outline:2px solid #6F95FF;outline-offset:1px}
.navlabel{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#6B7482;padding:4px 10px 2px;font-weight:600}
.main{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:10px 24px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.content{padding:20px 24px 80px;display:flex;flex-direction:column;gap:22px;max-width:1380px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.btn{border:0;border-radius:8px;padding:8px 14px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ok{background:var(--ok);color:#fff}
.btn2{border:1px solid var(--line);border-radius:8px;padding:7px 12px;background:var(--panel);color:var(--ink)}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:var(--panel);font-size:13px}
.btn:disabled,.btn2:disabled{opacity:.5;cursor:default}
.h2{margin:0;font-size:17px;font-weight:600}.muted{color:var(--muted)}.small{font-size:12px}.s13{font-size:13px}.mono{font-family:"IBM Plex Mono",monospace}
.hero{position:relative;color:var(--ink);border-radius:18px;padding:34px 28px 30px;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--panel);border:1px solid var(--line)}
.hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:18px 18px;pointer-events:none;mask-image:linear-gradient(180deg,rgba(0,0,0,.6),transparent)}
.hero>*{position:relative;z-index:1}
.hgreet{display:flex;align-items:center;gap:10px;font-size:13px;color:#AEB6C2}.hgreet .dchip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:2px 10px;color:#D7DCE4}
.hsteps{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.hstep{display:flex;align-items:center;gap:7px;font-size:12px;padding:4px 10px 4px 4px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#8D96A5}
.hstep .n{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:rgba(255,255,255,.08)}
.hstep.on{background:rgba(111,149,255,.18);border-color:rgba(111,149,255,.55);color:#fff;font-weight:600}.hstep.on .n{background:#4F7BFF;color:#fff}.hstep.done{color:#9FE2BF}.hstep.done .n{background:#1F7A4D;color:#fff}
.htitle{font-family:Fraunces,Georgia,serif;font-size:40px;line-height:1.08;font-weight:700;letter-spacing:-.01em;margin:0;color:var(--ink);text-align:center}
.hwrap{width:100%;max-width:720px;display:flex;flex-direction:column;gap:14px}
.hbox{display:flex;flex-direction:column;gap:10px;border:1px solid var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:18px;padding:16px 16px 10px;background:var(--panel);box-shadow:0 8px 24px rgba(30,63,176,.10);transition:box-shadow .2s}
.hbox:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent),0 8px 24px rgba(30,63,176,.10)}
.hbox textarea{border:0;outline:none;resize:none;font:inherit;font-size:16px;line-height:1.5;color:var(--ink);background:transparent;min-height:60px}
.hchip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-size:13px;cursor:pointer}
.hchip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong);font-weight:600}
.hsend{width:42px;height:42px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.hsend:disabled{opacity:.4;cursor:default}
.hscen{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:13px;cursor:pointer}
.hscen:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.hscen[disabled]{border-style:dashed;background:var(--soft);color:var(--muted);cursor:default}
.hlabel{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.ask2{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.97);border-radius:14px;padding:8px 8px 8px 14px;box-shadow:0 0 0 1px rgba(255,255,255,.2),0 8px 24px rgba(0,0,0,.25);transition:box-shadow .2s}
.ask2:focus-within{box-shadow:0 0 0 3px rgba(111,149,255,.6),0 8px 24px rgba(0,0,0,.25)}
.ask2 input{flex:1;border:0;outline:none;color:#14171C;background:transparent;min-width:0;font-size:15px;padding:8px 0}
.gobtn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:10px 16px;font-weight:600;background:linear-gradient(135deg,#4F7BFF,#2F5BEA);color:#fff;box-shadow:0 4px 12px rgba(47,91,234,.35)}.gobtn:disabled{background:#C9D3F5;box-shadow:none;color:#fff}
.scgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.scard{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#E6E9EE;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
.scard:hover:not([disabled]){background:rgba(111,149,255,.16);border-color:rgba(111,149,255,.55);transform:translateY(-1px)}.scard[disabled]{opacity:.5;cursor:default}
.scard .ic{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;flex:none;color:#C9D6FF}
.scard b{font-size:13px;color:#fff;display:block}.scard span.sub{font-size:12px;color:#AEB6C2}
.guide2{margin-top:auto;border-radius:14px;padding:12px;background:linear-gradient(160deg,#1F2533,#181D27);border:1px solid #2C3442;color:#C3C9D3;display:flex;flex-direction:column;gap:10px;font-size:12px}
.gbar{height:6px;border-radius:999px;background:#2C3442;overflow:hidden}.gbar>span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#4F7BFF,#9FE2BF);transition:width .4s}
.gcur{background:rgba(79,123,255,.14);border:1px solid rgba(79,123,255,.45);border-radius:10px;padding:9px 10px;display:flex;flex-direction:column;gap:3px}
.gcur .k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#9DB6FF;font-weight:700}.gcur .t{color:#fff;font-size:13px;line-height:1.35;font-weight:600}
.gnext{display:flex;gap:8px;align-items:flex-start;color:#8D96A5;line-height:1.35}.gnext .d{width:16px;height:16px;border-radius:50%;border:1px solid #3B4452;flex:none;font-size:9px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.gnext.done{color:#7FCFA5}.gnext.done .d{background:#1F7A4D;border-color:#1F7A4D;color:#fff}
.glink{background:none;border:0;color:#9DB6FF;font-size:12px;padding:0;cursor:pointer}.glink:hover{text-decoration:underline}
.ask{display:flex;gap:8px;background:#fff;border-radius:10px;padding:7px 7px 7px 14px;align-items:center}
.ask input{flex:1;border:0;outline:none;color:#14171C;background:transparent;min-width:0}
.mic{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--accent);display:flex;align-items:center;justify-content:center}
.mic.listening{background:#2F5BEA;color:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,91,234,.5)}100%{box-shadow:0 0 0 12px rgba(47,91,234,0)}}
.starter{border:1px solid #3B4452;border-radius:999px;padding:3px 10px;color:#E6E9EE;background:none;font-size:13px}
.shead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.strip{display:flex;gap:14px;overflow-x:auto;padding:3px 3px 8px;scroll-behavior:smooth;scrollbar-width:thin}
.ncard{flex:0 0 290px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;cursor:pointer}
.ncard:hover{border-color:var(--accent)}
.ncard.new{animation:pop .5s ease}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
.thumb{position:relative;height:140px;color:#fff;padding:12px;display:flex;flex-direction:column;gap:6px}
.due{position:absolute;top:10px;right:10px;background:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.wcard:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(20,23,28,.08)}
.wcard{flex:0 0 290px;transition:border-color .15s,box-shadow .15s;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.av{border-radius:50%;color:#fff;font-weight:600;display:inline-flex;align-items:center;justify-content:center;flex:none}
.tag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;white-space:nowrap}
.arow{display:grid;border-radius:6px;grid-template-columns:86px minmax(0,1.1fr) 18px minmax(0,1.5fr);gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.srow{display:grid;grid-template-columns:minmax(200px,240px) minmax(300px,1.2fr) minmax(240px,1fr) 22px;gap:18px;align-items:center;padding:13px 18px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;color:var(--ink)}
.srow:hover{background:var(--soft)}button.arow:hover{background:var(--soft)}
.stp{display:flex;align-items:flex-start;flex:1}
.st{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;position:relative}
.st .ln{position:absolute;top:5px;left:50%;width:100%;height:2px}
.st .dt{width:12px;height:12px;border-radius:50%;position:relative;z-index:1;box-sizing:border-box}
.st span.l{font-size:11px}
.bar{height:4px;background:var(--soft);border-radius:2px;overflow:hidden}
.drawer-back{position:fixed;inset:0;background:rgba(10,14,20,.35);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,96vw);background:var(--panel);z-index:31;display:flex;flex-direction:column;box-shadow:-12px 0 32px rgba(10,14,20,.25);animation:slide .25s ease}
@keyframes slide{from{transform:translateX(40px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.drawer,.ncard.new{animation:none}.mic.listening{animation:none}}
.dhead{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line)}
.dbody{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.dfoot{border-top:1px solid var(--line);padding:12px 18px;display:flex;flex-direction:column;gap:10px}
.stage{background:var(--canvas);border-radius:10px;padding:18px;display:flex;justify-content:center}
.pin{position:absolute;width:24px;height:24px;border-radius:50% 50% 50% 0;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25);z-index:3;transform:translate(-4px,-20px)}
.pinbox{position:absolute;z-index:4;background:var(--panel);color:var(--ink);border-radius:10px;box-shadow:0 10px 28px rgba(10,14,20,.3);padding:10px;width:260px;display:flex;flex-direction:column;gap:8px}
.msg{display:flex;gap:10px}.msg .b{display:flex;flex-direction:column;gap:3px}
.agentmsg{background:var(--accent-soft);border-radius:10px;padding:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#14171C;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.guide{background:var(--panel);color:var(--ink);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;margin-top:auto;font-size:12px}
.g{display:flex;gap:8px;color:var(--muted)}.g.on{color:var(--ink);font-weight:600}.g.done{color:var(--ok)}
.gn{width:18px;height:18px;border-radius:50%;flex:none;border:1px solid var(--line);font-size:10px;display:flex;align-items:center;justify-content:center}
.g.on .gn{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.g.done .gn{background:var(--ok);color:#fff;border-color:var(--ok)}
.working{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--accent-strong);font-weight:600}
.spin{width:10px;height:10px;border-radius:50%;border:2px solid var(--accent);border-right-color:transparent;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hide{display:none!important}
@media (max-width:1000px){.rail{display:none}.srow{grid-template-columns:1fr}.srow-h{display:none!important}.srow>:last-child{display:none}.arow{grid-template-columns:1fr}}
.mbtn{display:none}.rail-back{display:none}
@media (max-width:1000px){.rail{display:flex!important;position:fixed;left:0;top:0;bottom:0;height:100%;z-index:60;width:min(300px,86vw);transform:translateX(-105%);transition:transform .2s ease;box-shadow:12px 0 32px rgba(10,14,20,.35)}body.railopen .rail{transform:none}body.railopen .rail-back{display:block;position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:55}.mbtn{display:inline-flex;align-items:center;gap:6px;min-height:40px}.top{padding:8px 12px;gap:8px;flex-wrap:wrap}.content{padding-left:12px!important;padding-right:12px!important}}
@media (max-width:1000px){#view section.card{overflow-x:auto}.shead{flex-wrap:wrap}[role="group"]{flex-wrap:wrap;max-width:100%}}
@media (max-width:640px){.simfull{display:none}#view [style*="grid-template-columns:repeat(auto"]{grid-template-columns:1fr!important}#view .card,#view [style*="flex:"]{min-width:0}#view .card{overflow-x:auto}#view [style*="1 420px"],#view [style*="1 460px"],#view [style*="1 440px"]{flex-basis:100%!important}}
</style>
</head>

<script id="py-src" type="application/json">{"agent/__init__.py": "\"\"\"Brand Review agent core: drafting, rendering every format, rules, reviewer-taught lessons,\nscoped retrieval, pre-review, and the campaign workflow.\n\nStandard library only. Deterministic: the drafting step is pluggable, and the checks and\nlessons run the same way on whatever produced the draft.\n\"\"\"\nfrom .drafter import Brief, MissingFact, TemplateDrafter\nfrom .lessons import Lesson, LessonStore\nfrom .pipeline import Production, produce\nfrom .render import FORMATS, check_rendered, render_all\nfrom .prereview import PreReviewResult, prereview\nfrom .retrieval import in_scope, retrieve\nfrom .routing import route\nfrom .rules import BrandRules, check, contrast_ratio\nfrom .spec import Change, ContentSpec, Correction, Figure, Finding\nfrom .workflow import Campaign, IllegalMove\n\n__all__ = [\"FORMATS\", \"Brief\", \"MissingFact\", \"Production\", \"TemplateDrafter\", \"check_rendered\",\n           \"produce\", \"render_all\", \"BrandRules\", \"Campaign\", \"Change\", \"ContentSpec\", \"Correction\", \"Figure\", \"Finding\",\n           \"IllegalMove\", \"Lesson\", \"LessonStore\", \"PreReviewResult\", \"check\", \"contrast_ratio\",\n           \"in_scope\", \"prereview\", \"retrieve\", \"route\"]\n", "agent/drafter.py": "\"\"\"Drafting: brief in, content spec out.\n\nThe drafter is pluggable. This one is deterministic (approved copy patterns per product), so\nanyone can run it without a key. An LLM drafter would implement the same `draft()` signature;\neverything downstream (rules, lessons, rendering, checks) runs the same on its output.\n\nOne rule no drafter may break: every number in the copy comes from the offer sheet. If the\nfact isn't there, the drafter stops and asks instead of guessing.\n\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\nfrom typing import Protocol\n\nfrom .spec import ContentSpec, Figure\n\nDIRECTIONS = (\"benefit\", \"rate\", \"seasonal\")\n\n\nclass MissingFact(Exception):\n    \"\"\"The brief needs a number the offer sheet doesn't have. A person must supply it.\"\"\"\n\n\n@dataclass(frozen=True)\nclass Brief:\n    campaign: str\n    product: str                       # key into PRODUCTS\n    region: str = \"pnw\"\n    direction: str = \"benefit\"         # benefit | rate | seasonal\n    compare: tuple[str, ...] = ()      # offer-sheet keys to chart, for an infographic\n    notes: str = \"\"\n\n\n@dataclass(frozen=True)\nclass ProductCopy:\n    line: str\n    key: str                           # the offer-sheet field for the headline rate\n    unit: str                          # APR | APY\n    heads: dict = field(default_factory=dict)\n    sub: str = \"\"\n    cta: str = \"Learn more\"\n    image: str | None = None\n    bg: str = \"#0E4D64\"\n\n\nPRODUCTS = {\n    \"auto_refi\": ProductCopy(\n        \"lending\", \"auto_refi_apr\", \"APR\",\n        {\"benefit\": \"Refinance your auto loan and save\", \"rate\": \"Move your auto loan to {r}% APR\",\n         \"seasonal\": \"A lower rate for the road ahead\"},\n        \"Refinance at {r}% APR and you could lower your monthly payment.\", \"See your new rate\",\n        \"family-car-01\", \"#0E4D64\"),\n    \"personal_loan\": ProductCopy(\n        \"lending\", \"personal_loan_apr\", \"APR\",\n        {\"benefit\": \"One payment, less stress\", \"rate\": \"Consolidate at {r}% APR\",\n         \"seasonal\": \"Start the new year with one payment\"},\n        \"Consolidate at {r}% APR and you could lower your monthly payment.\", \"Check your rate\",\n        None, \"#24506B\"),\n    \"certificate\": ProductCopy(\n        \"deposits\", \"certificate_12m_apy\", \"APY\",\n        {\"benefit\": \"Let your savings work harder\", \"rate\": \"A guaranteed {r}% APY\",\n         \"seasonal\": \"Lock in a rate for the year ahead\"},\n        \"Earn {r}% APY on a 12-month certificate. Rate fixed for the term.\", \"Open a certificate\",\n        None, \"#7C5A2E\"),\n    \"balance_transfer\": ProductCopy(\n        \"cards\", \"balance_transfer_intro_apr\", \"APR\",\n        {\"benefit\": \"Pay down debt faster\", \"rate\": \"{r}% intro APR on balance transfers\",\n         \"seasonal\": \"A fresh start for your balance\"},\n        \"{r}% intro APR for 15 months on balance transfers.\", \"Apply now\", None, \"#5B2A4E\"),\n}\n\nTERM_LABELS = {\"certificate_6m_apy\": \"6-month\", \"certificate_12m_apy\": \"12-month\", \"certificate_24m_apy\": \"24-month\"}\n\n\nclass Drafter(Protocol):\n    def draft(self, brief: Brief, offer_sheet: dict) -> ContentSpec: ...\n\n\nclass TemplateDrafter:\n    \"\"\"Approved copy patterns per product, filled only with offer-sheet facts.\"\"\"\n\n    def draft(self, brief: Brief, offer_sheet: dict) -> ContentSpec:\n        if brief.product not in PRODUCTS:\n            raise MissingFact(f\"no approved copy patterns for '{brief.product}'; a person must write the first draft\")\n        p = PRODUCTS[brief.product]\n        if p.key not in offer_sheet:\n            raise MissingFact(f\"offer sheet has no '{p.key}'; which rate should this campaign use?\")\n        r = _fmt(offer_sheet[p.key])\n\n        if brief.compare:\n            missing = [k for k in brief.compare if k not in offer_sheet]\n            if missing:\n                raise MissingFact(f\"offer sheet has no {missing}; can't chart numbers we don't have\")\n            figs = tuple(Figure(TERM_LABELS.get(k, k), offer_sheet[k], k) for k in brief.compare)\n            return ContentSpec(brief.campaign, p.line, brief.product, brief.region,\n                               headline=\"Certificate rates at a glance\",\n                               sub=\"Pick the term that fits your plans.\", cta=\"Compare certificates\",\n                               bg_color=p.bg, figures=figs)\n\n        return ContentSpec(brief.campaign, p.line, brief.product, brief.region,\n                           headline=p.heads[brief.direction].format(r=r), sub=p.sub.format(r=r),\n                           cta=p.cta, image=p.image, bg_color=p.bg,\n                           figures=(Figure(f\"{brief.product} {p.unit}\", offer_sheet[p.key], p.key),))\n\n    def directions(self, brief: Brief, offer_sheet: dict) -> list[ContentSpec]:\n        \"\"\"Three creative directions for the marketer to choose between at the plan step.\"\"\"\n        return [self.draft(Brief(brief.campaign, brief.product, brief.region, d), offer_sheet) for d in DIRECTIONS]\n\n\ndef _fmt(x: float) -> str:\n    return f\"{x:.1f}\".rstrip(\"0\").rstrip(\".\") if x != int(x) else f\"{int(x)}\"\n", "agent/lessons.py": "\"\"\"Lessons: a reviewer's correction, stored so the agent applies it before that reviewer looks again.\n\nA lesson is data, not a retrained model. It has an owner (the reviewing function), a reason,\na scope, and a status. Only the owner, or an admin, can promote or retire it.\n\"\"\"\nfrom __future__ import annotations\n\nimport re\nfrom dataclasses import dataclass, field\nfrom datetime import date\n\nfrom .spec import Correction\n\nSTATUSES = (\"context\", \"proposed\", \"rule\", \"retired\")\n\n\ndef apply_edit(text: str, find: str, replace: str) -> str:\n    \"\"\"Replace every match, keeping a capital letter where the struck words had one.\"\"\"\n    def sub(m: re.Match) -> str:\n        new = m.expand(replace)\n        if m.group(0)[:1].isupper() and new[:1].islower():\n            new = new[0].upper() + new[1:]\n        return new\n    out = re.sub(r\"\\s{2,}\", \" \", re.sub(find, sub, text, flags=re.I)).strip()\n    if text[:1].isupper() and out[:1].islower():   # struck the first word: the next one starts the sentence\n        out = out[0].upper() + out[1:]\n    return out\n\n\nSTALE_AFTER_DAYS = 182\n\n\n@dataclass\nclass Lesson:\n    id: str\n    text: str\n    owner: str                      # legal | brand | compliance\n    reason: str                     # claim | imagery | tone | legal | layout\n    field: str                      # which spec field it edits\n    find: str                       # regex\n    replace: str\n    scope: dict                     # {\"product_line\": ..., \"product\": ..., \"region\": ...}; \"all\" = any\n    taught_by: str\n    taught_on: date\n    status: str = \"context\"\n    uses: int = 0\n    repeats_avoided: int = 0\n    last_used: date | None = None\n    applied_in: list = field(default_factory=list)\n\n    def matches(self, text: str) -> bool:\n        return re.search(self.find, text, flags=re.I) is not None\n\n\nclass LessonStore:\n    def __init__(self) -> None:\n        self._lessons: dict[str, Lesson] = {}\n        self._next = 1\n\n    def __iter__(self):\n        return iter(self._lessons.values())\n\n    def __len__(self) -> int:\n        return len(self._lessons)\n\n    def get(self, lesson_id: str) -> Lesson:\n        return self._lessons[lesson_id]\n\n    def learn(self, c: Correction, scope: dict, today: date) -> Lesson:\n        \"\"\"Turn a reviewer's correction into a scoped lesson. The reviewer chose the scope on the review link.\"\"\"\n        for l in self._lessons.values():  # same correction again: don't duplicate, it's the same lesson\n            if l.owner == c.function and l.find == c.find and l.replace == c.replace and l.scope == scope:\n                return l\n        lid = f\"lsn_{self._next:04d}\"\n        self._next += 1\n        lesson = Lesson(id=lid, text=c.note or f\"'{c.find}' -> '{c.replace}'\", owner=c.function, reason=c.reason,\n                        field=c.field, find=c.find, replace=c.replace, scope=dict(scope),\n                        taught_by=c.reviewer, taught_on=today)\n        self._lessons[lid] = lesson\n        return lesson\n\n    def _authorize(self, lesson: Lesson, actor_function: str) -> None:\n        if actor_function not in (lesson.owner, \"admin\"):\n            raise PermissionError(f\"{actor_function} cannot change a lesson owned by {lesson.owner}\")\n\n    def propose(self, lesson_id: str, actor_function: str) -> None:\n        l = self._lessons[lesson_id]\n        if l.status == \"context\":   # anyone may propose; only the owner decides\n            l.status = \"proposed\"\n\n    def promote(self, lesson_id: str, actor_function: str) -> None:\n        l = self._lessons[lesson_id]\n        self._authorize(l, actor_function)\n        l.status = \"rule\"\n\n    def retire(self, lesson_id: str, actor_function: str) -> None:\n        l = self._lessons[lesson_id]\n        self._authorize(l, actor_function)\n        l.status = \"retired\"\n\n    def stale(self, today: date) -> list[Lesson]:\n        return [l for l in self._lessons.values() if l.status != \"retired\"\n                and (today - (l.last_used or l.taught_on)).days > STALE_AFTER_DAYS]\n", "agent/pipeline.py": "\"\"\"The whole loop for one draft: brief -> draft -> pre-review -> render every format -> check what was drawn.\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\nfrom datetime import date\n\nfrom .drafter import Brief, Drafter, TemplateDrafter\nfrom .lessons import LessonStore\nfrom .prereview import PreReviewResult, prereview\nfrom .render import Rendered, check_rendered, render_all\nfrom .rules import BrandRules\nfrom .spec import Finding\n\n\n@dataclass\nclass Production:\n    review: PreReviewResult\n    outputs: dict[str, Rendered]\n    render_findings: list[Finding]\n\n    @property\n    def blocked(self) -> list[Finding]:\n        return self.review.blocked + [f for f in self.render_findings if f.required and not f.ok]\n\n    @property\n    def can_send(self) -> bool:\n        return not self.blocked and not self.review.conflicts\n\n\ndef produce(brief: Brief, offer_sheet: dict, rules: BrandRules, store: LessonStore | None, today: date,\n            drafter: Drafter | None = None) -> Production:\n    source_name = offer_sheet.get(\"_name\", \"\")\n    facts = {k: v for k, v in offer_sheet.items() if not k.startswith(\"_\")}\n    spec = (drafter or TemplateDrafter()).draft(brief, facts)\n    review = prereview(spec, rules, store, today, facts)\n    outputs = render_all(review.spec, rules, source_name)\n    return Production(review, outputs, check_rendered(review.spec, outputs, facts, source_name))\n", "agent/prereview.py": "\"\"\"Pre-review: everything the agent does to a draft before a person sees it.\n\n1. Route: which functions will review this draft.\n2. Retrieve and apply those functions' lessons (in scope only; conflicts go to the marketer).\n3. Apply safe rule fixes (disclaimer, banner length, contrast).\n4. Re-check every rule. Any failing required rule blocks sending.\n\nEvery edit is returned as a Change with its source, so the asset can explain itself.\n\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\nfrom datetime import date\n\nfrom .lessons import LessonStore, apply_edit\nfrom .retrieval import retrieve\nfrom .routing import route\nfrom .rules import BrandRules, autofix, check\nfrom .spec import Change, ContentSpec, Finding\n\n\n@dataclass\nclass PreReviewResult:\n    spec: ContentSpec\n    routed_to: set[str]\n    changes: list[Change]\n    findings: list[Finding]\n    conflicts: list = field(default_factory=list)\n    lessons_applied: list = field(default_factory=list)\n\n    @property\n    def blocked(self) -> list[Finding]:\n        return [f for f in self.findings if f.required and not f.ok]\n\n    @property\n    def can_send(self) -> bool:\n        return not self.blocked and not self.conflicts\n\n\ndef prereview(spec: ContentSpec, rules: BrandRules, store: LessonStore | None, today: date,\n              source: dict | None = None, new_image: bool = False, use_lessons: bool = True,\n              scoped: bool = True) -> PreReviewResult:\n    routed = route(spec, new_image=new_image)\n    changes: list[Change] = []\n    applied, conflicts = [], []\n\n    if store is not None and use_lessons:\n        r = retrieve(store, spec, routed, scoped=scoped)\n        conflicts = r.conflicts\n        for lesson in r.apply:\n            before = getattr(spec, lesson.field)\n            after = apply_edit(before, lesson.find, lesson.replace)\n            if after == before:\n                continue\n            spec = spec.with_(**{lesson.field: after})\n            changes.append(Change(lesson.field, before, after, \"lesson\",\n                                  f\"Lesson {lesson.id} from {lesson.taught_by} ({lesson.owner}), \"\n                                  f\"{lesson.taught_on:%b %d}: {lesson.text}\"))\n            lesson.uses += 1\n            lesson.last_used = today\n            lesson.applied_in.append(spec.campaign)\n            applied.append(lesson)\n\n    spec, fixes = autofix(spec, rules)\n    changes += fixes\n    return PreReviewResult(spec, routed, changes, check(spec, rules, source), conflicts, applied)\n", "agent/render.py": "\"\"\"Rendering: one content spec, every format, each with its own layout.\n\nFormats are re-laid out, not scaled: each has its own boxes, font range and text choice\n(the 728x90 banner uses the short headline). Text is fitted by stepping the font size down\nuntil it fits its box; if it can't fit at the minimum size, that's a render finding, not a\nsilent overflow. Images come only from the approved library; an empty slot renders as a\nvisible placeholder. Infographics draw bars from figures and print their source.\n\nOutput is SVG: text stays text, so every rendered word can be checked.\n\"\"\"\nfrom __future__ import annotations\n\nimport re\nfrom dataclasses import dataclass, field\nfrom html import escape\n\nfrom .rules import BrandRules, states_rate\nfrom .spec import ContentSpec, Finding\n\nSERIF = \"Georgia, 'Times New Roman', serif\"\nSANS = \"-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif\"\nCTA_BG = \"#B5431A\"\n# Average glyph width as a share of font size. Deliberately a little generous, so an\n# estimate that fits here fits in real fonts too.\nEM = {\"serif\": 0.56, \"sans\": 0.54}\n\n\n@dataclass(frozen=True)\nclass Box:\n    x: float\n    y: float\n    w: float\n    h: float\n\n\n@dataclass(frozen=True)\nclass Layout:\n    name: str\n    w: int\n    h: int\n    headline: Box\n    head_size: tuple[int, int]         # (max, min) font size\n    sub: Box | None = None\n    sub_size: tuple[int, int] = (0, 0)\n    cta: Box | None = None\n    disclaimer: Box | None = None\n    disc_size: tuple[int, int] = (0, 0)\n    image: Box | None = None\n    chart: Box | None = None\n    use_short_headline: bool = False\n    logo: tuple[float, float, int] = (0, 0, 0)\n\n\nFORMATS = {\n    \"post_1x1\": Layout(\"Instagram post 1:1\", 1080, 1080, Box(80, 380, 920, 260), (96, 56),\n                       Box(80, 670, 920, 120), (40, 28), Box(80, 830, 380, 84),\n                       Box(80, 960, 920, 80), (24, 18), Box(80, 140, 920, 200), logo=(80, 100, 30)),\n    \"portrait_4x5\": Layout(\"Portrait 4:5\", 1080, 1350, Box(80, 560, 920, 300), (104, 60),\n                           Box(80, 890, 920, 140), (42, 28), Box(80, 1070, 400, 88),\n                           Box(80, 1220, 920, 90), (24, 18), Box(80, 150, 920, 360), logo=(80, 100, 30)),\n    \"story_9x16\": Layout(\"Story 9:16\", 1080, 1920, Box(90, 820, 900, 420), (120, 70),\n                         Box(90, 1270, 900, 200), (46, 30), Box(90, 1520, 460, 100),\n                         Box(90, 1740, 900, 110), (26, 18), Box(90, 200, 900, 560), logo=(90, 150, 34)),\n    \"display_300x250\": Layout(\"Display 300x250\", 300, 250, Box(16, 40, 268, 92), (28, 16),\n                              Box(16, 136, 268, 40), (13, 10), Box(16, 184, 130, 30),\n                              Box(16, 220, 268, 24), (8, 7), logo=(16, 26, 11)),\n    \"leaderboard_728x90\": Layout(\"Leaderboard 728x90\", 728, 90, Box(150, 18, 330, 54), (26, 16),\n                                 cta=Box(600, 26, 112, 38), disclaimer=Box(488, 14, 104, 64), disc_size=(9, 7),\n                                 use_short_headline=True, logo=(16, 52, 13)),\n}\nINFOGRAPHIC = Layout(\"Infographic 4:5\", 1080, 1350, Box(80, 150, 920, 200), (88, 56),\n                     Box(80, 360, 920, 80), (36, 26), disclaimer=Box(80, 1210, 920, 100), disc_size=(24, 18),\n                     chart=Box(80, 480, 920, 680), logo=(80, 100, 30))\n\n\n@dataclass\nclass Rendered:\n    format: str\n    layout: Layout\n    svg: str\n    lines: dict = field(default_factory=dict)       # field -> list of rendered lines\n    findings: list = field(default_factory=list)\n\n    @property\n    def text(self) -> str:\n        return \" \".join(\" \".join(v) for v in self.lines.values())\n\n\ndef text_width(s: str, size: float, face: str) -> float:\n    return len(s) * size * EM[face]\n\n\ndef wrap(text: str, width: float, size: float, face: str) -> list[str]:\n    lines, cur = [], \"\"\n    for word in text.split():\n        trial = f\"{cur} {word}\".strip()\n        if cur and text_width(trial, size, face) > width:\n            lines.append(cur)\n            cur = word\n        else:\n            cur = trial\n    return lines + ([cur] if cur else [])\n\n\ndef fit(text: str, box: Box, sizes: tuple[int, int], face: str, lh: float = 1.12):\n    \"\"\"Largest font size at which the text fits the box. Returns (size, lines, fits).\"\"\"\n    hi, lo = sizes\n    for size in range(hi, lo - 1, -2):\n        lines = wrap(text, box.w, size, face)\n        if len(lines) * size * lh <= box.h and all(text_width(l, size, face) <= box.w for l in lines):\n            return size, lines, True\n    lines = wrap(text, box.w, lo, face)\n    return lo, lines, False\n\n\ndef _text(lines, box, size, face, color, weight=400, lh=1.12, anchor=\"start\"):\n    x = box.x + (box.w / 2 if anchor == \"middle\" else 0)\n    out = []\n    for i, line in enumerate(lines):\n        y = box.y + size * (i + 0.9) * lh\n        out.append(f'<text x=\"{x:.0f}\" y=\"{y:.0f}\" font-family=\"{SERIF if face == \"serif\" else SANS}\" '\n                   f'font-size=\"{size}\" font-weight=\"{weight}\" fill=\"{color}\" text-anchor=\"{anchor}\">{escape(line)}<\/text>')\n    return \"\".join(out)\n\n\ndef render(spec: ContentSpec, fmt: str, rules: BrandRules, source_name: str = \"\") -> Rendered:\n    L = INFOGRAPHIC if fmt == \"infographic\" else FORMATS[fmt]\n    parts = [f'<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"{L.w}\" height=\"{L.h}\" viewBox=\"0 0 {L.w} {L.h}\" '\n             f'role=\"img\" aria-label=\"{escape(spec.headline)}\">',\n             f'<rect width=\"{L.w}\" height=\"{L.h}\" fill=\"{spec.bg_color}\"/>']\n    r = Rendered(fmt, L, \"\")\n    fg = spec.text_color\n\n    lx, ly, ls = L.logo\n    if ls:\n        parts.append(f'<text x=\"{lx}\" y=\"{ly}\" font-family=\"{SANS}\" font-size=\"{ls}\" font-weight=\"700\" fill=\"{fg}\">Harbor &amp; Pine<\/text>')\n\n    if L.image:\n        b = L.image\n        if spec.image and spec.image in rules.approved_images:\n            parts.append(f'<rect x=\"{b.x}\" y=\"{b.y}\" width=\"{b.w}\" height=\"{b.h}\" rx=\"8\" fill=\"{fg}\" fill-opacity=\"0.18\"/>'\n                         f'<text x=\"{b.x + 16}\" y=\"{b.y + b.h - 18}\" font-family=\"{SANS}\" font-size=\"{max(12, b.h // 14)}\" '\n                         f'fill=\"{fg}\" fill-opacity=\"0.8\">approved image: {escape(spec.image)}<\/text>')\n        elif spec.image:\n            parts.append(f'<rect x=\"{b.x}\" y=\"{b.y}\" width=\"{b.w}\" height=\"{b.h}\" rx=\"8\" fill=\"none\" stroke=\"#FFB4A8\" '\n                         f'stroke-width=\"4\" stroke-dasharray=\"14 10\"/><text x=\"{b.x + b.w / 2}\" y=\"{b.y + b.h / 2}\" '\n                         f'text-anchor=\"middle\" font-family=\"{SANS}\" font-size=\"{max(12, b.h // 10)}\" fill=\"#FFB4A8\">'\n                         f'Image needed: not in the approved library<\/text>')\n            r.findings.append(Finding(f\"{fmt}:image\", False, True, f\"{spec.image} is not approved; placeholder shown\",\n                                      \"pick an approved image\"))\n\n    head_text = (spec.short_headline or spec.headline) if L.use_short_headline else spec.headline\n    size, lines, ok = fit(head_text, L.headline, L.head_size, \"serif\")\n    r.lines[\"headline\"] = lines\n    parts.append(_text(lines, L.headline, size, \"serif\", fg, 700))\n    if not ok:\n        r.findings.append(Finding(f\"{fmt}:headline_fit\", False, True,\n                                  f\"headline needs {len(lines)} lines at {size}px; box holds fewer\", \"shorten the headline\"))\n\n    if L.sub and spec.sub:\n        size, lines, ok = fit(spec.sub, L.sub, L.sub_size, \"sans\", 1.25)\n        r.lines[\"sub\"] = lines\n        parts.append(_text(lines, L.sub, size, \"sans\", fg, 400, 1.25))\n        if not ok:\n            r.findings.append(Finding(f\"{fmt}:sub_fit\", False, True, \"supporting line doesn't fit\", \"shorten it\"))\n\n    if L.cta:\n        b = L.cta\n        size = int(b.h * 0.42)\n        label = spec.cta\n        while text_width(label, size, \"sans\") > b.w - b.h * 0.5 and size > 7:\n            size -= 1\n        parts.append(f'<rect x=\"{b.x}\" y=\"{b.y}\" width=\"{b.w}\" height=\"{b.h}\" rx=\"{b.h / 2:.0f}\" fill=\"{CTA_BG}\"/>'\n                     f'<text x=\"{b.x + b.w / 2}\" y=\"{b.y + b.h / 2 + size * 0.35:.0f}\" text-anchor=\"middle\" '\n                     f'font-family=\"{SANS}\" font-size=\"{size}\" font-weight=\"700\" fill=\"#FFFFFF\">{escape(label)}<\/text>')\n        r.lines[\"cta\"] = [label]\n\n    if L.chart and spec.figures:\n        parts.append(_chart(spec, L.chart, fg, r))\n\n    if L.chart and spec.figures:\n        src = f\"Source: {source_name}.\" if source_name else \"Source: not provided.\"\n        r.lines[\"source\"] = [src]\n        parts.append(_text([src], Box(L.chart.x, L.chart.y + L.chart.h + 4, L.chart.w, 30), 22, \"sans\", fg))\n\n    if L.disclaimer and spec.disclaimer:\n        size, lines, ok = fit(spec.disclaimer, L.disclaimer, L.disc_size, \"sans\", 1.2)\n        r.lines[\"disclaimer\"] = lines\n        parts.append(_text(lines, L.disclaimer, size, \"sans\", fg, 400, 1.2))\n        if not ok:\n            r.findings.append(Finding(f\"{fmt}:disclaimer_fit\", False, True,\n                                      \"disclaimer doesn't fit its slot at the minimum legible size\", \"resize the slot\"))\n\n    parts.append(\"<\/svg>\")\n    r.svg = \"\".join(parts)\n    return r\n\n\ndef _chart(spec: ContentSpec, box: Box, fg: str, r: Rendered) -> str:\n    figs = spec.figures\n    top = max(f.value for f in figs) or 1\n    gap = box.w * 0.08\n    bw = (box.w - gap * (len(figs) - 1)) / len(figs)\n    label_h, value_h = 60, 80\n    max_h = box.h - label_h - value_h\n    out, printed = [], []\n    for i, f in enumerate(figs):\n        h = max_h * f.value / top          # bars start at zero: no exaggerated differences\n        x = box.x + i * (bw + gap)\n        y = box.y + value_h + (max_h - h)\n        value = f\"{f.value:.1f}%\"\n        printed.append(value)\n        out.append(f'<rect x=\"{x:.0f}\" y=\"{y:.0f}\" width=\"{bw:.0f}\" height=\"{h:.0f}\" rx=\"10\" fill=\"{fg}\" fill-opacity=\"0.92\"/>'\n                   f'<text x=\"{x + bw / 2:.0f}\" y=\"{y - 20:.0f}\" text-anchor=\"middle\" font-family=\"{SERIF}\" font-size=\"60\" '\n                   f'font-weight=\"700\" fill=\"{fg}\">{value}<\/text>'\n                   f'<text x=\"{x + bw / 2:.0f}\" y=\"{box.y + box.h - 14:.0f}\" text-anchor=\"middle\" font-family=\"{SANS}\" '\n                   f'font-size=\"32\" fill=\"{fg}\">{escape(f.label)}<\/text>')\n    r.lines[\"chart\"] = printed\n    return \"\".join(out)\n\n\ndef render_all(spec: ContentSpec, rules: BrandRules, source_name: str = \"\") -> dict[str, Rendered]:\n    fmts = [\"infographic\"] if len(spec.figures) > 1 else list(FORMATS)\n    return {f: render(spec, f, rules, source_name) for f in fmts}\n\n\ndef check_rendered(spec: ContentSpec, outputs: dict[str, Rendered], source: dict, source_name: str = \"\") -> list[Finding]:\n    \"\"\"Checks on what was actually drawn, not on the spec: the last line of defense.\"\"\"\n    out: list[Finding] = []\n    for fmt, r in outputs.items():\n        out += r.findings\n        if states_rate(spec):\n            disc = \" \".join(r.lines.get(\"disclaimer\", []))\n            out.append(Finding(f\"{fmt}:disclaimer_rendered\", bool(disc) and disc == spec.disclaimer, True,\n                               \"disclaimer rendered in full\" if disc == spec.disclaimer else \"disclaimer missing or cut\",\n                               \"add or resize the disclaimer slot\"))\n        if \"chart\" in r.lines:\n            src = r.lines.get(\"source\", [\"\"])[0]\n            out.append(Finding(f\"{fmt}:source_printed\", bool(source_name) and source_name in src, True,\n                               src or \"no source line\", \"print the source under the chart\"))\n            for f in spec.figures:\n                drawn = f\"{f.value:.1f}%\" in r.lines[\"chart\"]\n                ok = drawn and abs(source.get(f.source_field, float(\"nan\")) - f.value) < 1e-9\n                out.append(Finding(f\"{fmt}:bar {f.label}\", ok, True,\n                                   f\"bar {f.label} drawn at {f.value}%, offer sheet {source.get(f.source_field)}\",\n                                   \"use the offer-sheet value\"))\n        for num in re.findall(r\"(\\d+(?:\\.\\d+)?)%\", r.text):\n            ok = any(abs(float(num) - v) < 1e-9 for v in source.values() if isinstance(v, (int, float)))\n            out.append(Finding(f\"{fmt}:number {num}%\", ok, True,\n                               f\"{num}% {'matches' if ok else 'is NOT in'} the offer sheet\", \"use the offer-sheet value\"))\n    return out\n", "agent/retrieval.py": "\"\"\"Pick the lessons that apply to a draft, and nothing else.\n\nFilters, in order: not retired, owned by a function this draft is routed to, in scope\n(product line, product, region), and actually matching the draft's text. Ranked by most\nrecently taught, then most used. Two lessons that would edit the same text differently\nare a conflict: neither is applied, and the marketer decides.\n\"\"\"\nfrom __future__ import annotations\n\nimport re\nfrom dataclasses import dataclass\n\nfrom .lessons import Lesson, LessonStore\nfrom .spec import ContentSpec\n\nSCOPE_KEYS = (\"product_line\", \"product\", \"region\")\n\n\ndef in_scope(lesson: Lesson, spec: ContentSpec) -> bool:\n    for key in SCOPE_KEYS:\n        want = lesson.scope.get(key, \"all\")\n        if want != \"all\" and want != getattr(spec, key):\n            return False\n    return True\n\n\n@dataclass\nclass Retrieved:\n    apply: list[Lesson]\n    conflicts: list[tuple[Lesson, Lesson]]\n    skipped_out_of_scope: list[Lesson]\n\n\ndef retrieve(store: LessonStore, spec: ContentSpec, routed_to: set[str], scoped: bool = True) -> Retrieved:\n    candidates, out_of_scope = [], []\n    for l in store:\n        if l.status == \"retired\" or l.owner not in routed_to:\n            continue\n        if not l.matches(getattr(spec, l.field)):\n            continue\n        if scoped and not in_scope(l, spec):\n            out_of_scope.append(l)\n            continue\n        candidates.append(l)\n\n    candidates.sort(key=lambda l: (l.taught_on, l.uses), reverse=True)\n\n    conflicts, apply, blocked = [], [], set()\n    for i, a in enumerate(candidates):\n        for b in candidates[i + 1:]:\n            if a.field == b.field and a.replace != b.replace and _overlap(a, b, getattr(spec, a.field)):\n                conflicts.append((a, b))\n                blocked.update({a.id, b.id})\n    apply = [l for l in candidates if l.id not in blocked]\n    return Retrieved(apply, conflicts, out_of_scope)\n\n\ndef _overlap(a: Lesson, b: Lesson, text: str) -> bool:\n    spans = lambda l: [m.span() for m in re.finditer(l.find, text, flags=re.I)]\n    return any(s1 < e2 and s2 < e1 for s1, e1 in spans(a) for s2, e2 in spans(b))\n", "agent/routing.py": "\"\"\"Who reviews a draft. Each function owns its routing rule; the agent only suggests, people send.\"\"\"\nfrom __future__ import annotations\n\nimport re\n\nfrom .rules import states_rate\nfrom .spec import ContentSpec\n\nPAYMENT_OR_CLAIM = re.compile(r\"\\b(save|savings|lower|payment|guarantee[d]?|best|free)\\b\", re.I)\n\n\ndef route(spec: ContentSpec, new_image: bool = False) -> set[str]:\n    who: set[str] = set()\n    if states_rate(spec) or PAYMENT_OR_CLAIM.search(spec.text()):\n        who.add(\"legal\")\n    if spec.product_line == \"cards\" or re.search(r\"\\bfees?\\b\", spec.text(), re.I):\n        who.update({\"legal\", \"compliance\"})\n    if spec.product == \"mortgage\":\n        who.add(\"compliance\")\n    if new_image or spec.product_line == \"branch\":\n        who.add(\"brand\")\n    return who or {\"brand\"}\n", "agent/rules.py": "\"\"\"Written brand rules: deterministic checks, run on every draft before anyone reviews it.\n\nRequired rules block sending. Some failures have a safe automatic fix (add the disclaimer,\nshorten the banner headline); others never do (a figure that disagrees with its source is\nblocked until a person confirms the right number).\n\"\"\"\nfrom __future__ import annotations\n\nimport re\nfrom dataclasses import dataclass, field\n\nfrom .spec import Change, ContentSpec, Finding\n\nRATE = re.compile(r\"\\d+(\\.\\d+)?\\s*%|\\bAP[RY]\\b\")\n\n\n@dataclass\nclass BrandRules:\n    version: str = \"v14\"\n    min_contrast: float = 4.5            # WCAG AA for normal text\n    banner_max_chars: int = 30\n    rate_disclaimer: str = \"APR = Annual Percentage Rate. Rates and terms subject to approval.\"\n    yield_disclaimer: str = \"APY = Annual Percentage Yield. Rate fixed for the term.\"\n    approved_images: frozenset = field(default_factory=lambda: frozenset(\n        {\"branch-ballard-2026\", \"branch-fremont-2025\", \"branch-tacoma-2025\", \"family-car-01\"}))\n\n\n# ---------- contrast (WCAG 2.x relative luminance) ----------\n\ndef _lum(hex_color: str) -> float:\n    h = hex_color.lstrip(\"#\")\n    r, g, b = (int(h[i:i + 2], 16) / 255 for i in (0, 2, 4))\n    lin = [c / 12.92 if c <= 0.03928 else ((c + 0.055) / 1.055) ** 2.4 for c in (r, g, b)]\n    return 0.2126 * lin[0] + 0.7152 * lin[1] + 0.0722 * lin[2]\n\n\ndef contrast_ratio(fg: str, bg: str) -> float:\n    a, b = sorted((_lum(fg), _lum(bg)), reverse=True)\n    return (a + 0.05) / (b + 0.05)\n\n\ndef _darken(hex_color: str, f: float = 0.85) -> str:\n    h = hex_color.lstrip(\"#\")\n    return \"#\" + \"\".join(f\"{int(int(h[i:i + 2], 16) * f):02X}\" for i in (0, 2, 4))\n\n\n# ---------- checks ----------\n\ndef states_rate(spec: ContentSpec) -> bool:\n    return bool(RATE.search(f\"{spec.headline} {spec.sub}\")) or bool(spec.figures)\n\n\ndef check(spec: ContentSpec, rules: BrandRules, source: dict | None = None) -> list[Finding]:\n    source = source or {}\n    out: list[Finding] = []\n\n    ratio = contrast_ratio(spec.text_color, spec.bg_color)\n    out.append(Finding(\"contrast\", ratio >= rules.min_contrast, True,\n                       f\"{ratio:.1f}:1 (minimum {rules.min_contrast}:1)\", \"darken the background\"))\n\n    needs = states_rate(spec)\n    out.append(Finding(\"disclaimer\", (not needs) or bool(spec.disclaimer.strip()), True,\n                       \"rate stated, disclaimer present\" if needs and spec.disclaimer else\n                       \"rate stated, no disclaimer\" if needs else \"no rate stated\", \"add the disclaimer\"))\n\n    banner = spec.short_headline or spec.headline\n    out.append(Finding(\"banner_fit\", len(banner) <= rules.banner_max_chars, False,\n                       f\"banner headline {len(banner)} chars (max {rules.banner_max_chars})\", \"shorten it\"))\n\n    if spec.image is None:\n        out.append(Finding(\"approved_image\", True, False, \"no image slot\"))\n    else:\n        ok = spec.image in rules.approved_images\n        out.append(Finding(\"approved_image\", ok, True,\n                           f\"{spec.image} is {'in' if ok else 'NOT in'} the approved library\",\n                           \"pick an approved image\"))\n\n    for fig in spec.figures:\n        if fig.source_field not in source:\n            out.append(Finding(f\"figure:{fig.label}\", False, True,\n                               f\"{fig.label}: no field '{fig.source_field}' in the offer sheet\",\n                               \"bind the figure to a source field\"))\n        elif abs(source[fig.source_field] - fig.value) > 1e-9:\n            out.append(Finding(f\"figure:{fig.label}\", False, True,\n                               f\"{fig.label}: asset says {fig.value}, offer sheet says {source[fig.source_field]}\",\n                               f\"use {source[fig.source_field]}\"))\n        else:\n            out.append(Finding(f\"figure:{fig.label}\", True, True, f\"{fig.label}: matches the offer sheet\"))\n    return out\n\n\ndef autofix(spec: ContentSpec, rules: BrandRules) -> tuple[ContentSpec, list[Change]]:\n    \"\"\"Apply only the fixes that can't change meaning. Figures and images are never auto-fixed.\"\"\"\n    changes: list[Change] = []\n\n    if states_rate(spec) and not spec.disclaimer.strip():\n        text = rules.yield_disclaimer if re.search(r\"\\bAPY\\b\", spec.text()) else rules.rate_disclaimer\n        changes.append(Change(\"disclaimer\", \"\", text, \"rule\",\n                              f\"Brand rule {rules.version}: disclaimer required when a rate is stated\"))\n        spec = spec.with_(disclaimer=text)\n\n    banner = spec.short_headline or spec.headline\n    if len(banner) > rules.banner_max_chars:\n        words, short = banner.split(), \"\"\n        for w in words:\n            if len((short + \" \" + w).strip()) > rules.banner_max_chars:\n                break\n            short = (short + \" \" + w).strip()\n        short = re.sub(r\"\\s+(and|or|the|your|to|for|with|a|of|at|on)$\", \"\", short, flags=re.I)\n        changes.append(Change(\"short_headline\", banner, short, \"rule\",\n                              f\"Brand rule {rules.version}: banner headline max {rules.banner_max_chars} characters\"))\n        spec = spec.with_(short_headline=short)\n\n    if contrast_ratio(spec.text_color, spec.bg_color) < rules.min_contrast:\n        bg = spec.bg_color\n        for _ in range(12):\n            bg = _darken(bg)\n            if contrast_ratio(spec.text_color, bg) >= rules.min_contrast:\n                break\n        changes.append(Change(\"bg_color\", spec.bg_color, bg, \"rule\",\n                              f\"Brand rule {rules.version}: text contrast at least {rules.min_contrast}:1\"))\n        spec = spec.with_(bg_color=bg)\n\n    return spec, changes\n", "agent/spec.py": "\"\"\"The content spec: one structured description of an ad that every format renders from.\n\nAgents edit the spec, never pixels. That is what makes every change checkable and explainable.\n\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field, replace\n\nTEXT_FIELDS = (\"headline\", \"short_headline\", \"sub\", \"cta\", \"disclaimer\")\n\n\n@dataclass(frozen=True)\nclass Figure:\n    \"\"\"A number printed on the asset, bound to a field in a source table (an offer sheet).\"\"\"\n    label: str          # \"12-month certificate\"\n    value: float        # what the asset says\n    source_field: str   # key in the offer sheet, e.g. \"cert_12m_apy\"\n\n\n@dataclass(frozen=True)\nclass ContentSpec:\n    campaign: str\n    product_line: str           # lending, deposits, cards, branch\n    product: str                # auto_refi, personal_loan, certificate, ...\n    region: str                 # pnw, national, ...\n    headline: str\n    sub: str = \"\"\n    cta: str = \"Learn more\"\n    short_headline: str = \"\"    # used on the 728x90 banner\n    disclaimer: str = \"\"\n    text_color: str = \"#FFFFFF\"\n    bg_color: str = \"#0E4D64\"\n    image: str | None = None    # asset id from the approved library, or None\n    figures: tuple[Figure, ...] = ()\n\n    def text(self) -> str:\n        return \" \".join(getattr(self, f) for f in TEXT_FIELDS)\n\n    def with_(self, **changes) -> \"ContentSpec\":\n        return replace(self, **changes)\n\n\n@dataclass(frozen=True)\nclass Change:\n    \"\"\"One edit the agent made, and why. Every change must carry a source.\"\"\"\n    field: str\n    before: str\n    after: str\n    kind: str     # rule | lesson | fallback\n    source: str   # e.g. \"Brand rule: disclaimer required when a rate is stated\"\n\n\n@dataclass\nclass Finding:\n    rule: str\n    ok: bool\n    required: bool\n    evidence: str\n    suggested_fix: str = \"\"\n\n\n@dataclass\nclass Correction:\n    \"\"\"What a reviewer does on the review link: change a span of text, with a reason.\"\"\"\n    reviewer: str\n    function: str        # legal, brand, compliance\n    field: str\n    find: str            # regex for what they struck\n    replace: str         # what they wrote instead\n    reason: str          # claim, imagery, tone, legal, layout\n    campaign: str = \"\"\n    note: str = \"\"\n    extra: dict = field(default_factory=dict)\n", "agent/workflow.py": "\"\"\"Campaign lifecycle as an explicit state machine.\n\nAt any moment exactly one party holds a campaign: the marketer, a reviewer, the agent,\nor the clock. Illegal moves raise instead of happening quietly, and every move is logged.\n\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\n\nSTAGES = (\"brief\", \"plan\", \"create\", \"review\", \"approved\", \"live\")\n\n# (from, to): who is allowed to make the move\nTRANSITIONS = {\n    (\"brief\", \"plan\"): {\"agent\"},\n    (\"plan\", \"create\"): {\"marketer\"},          # the marketer approves the plan\n    (\"create\", \"create\"): {\"agent\"},           # self-check failed, agent fixes\n    (\"create\", \"review\"): {\"marketer\"},        # only a person sends, and only if nothing blocks\n    (\"review\", \"create\"): {\"reviewer\"},        # change requested\n    (\"review\", \"approved\"): {\"reviewer\"},      # last required reviewer approves\n    (\"approved\", \"live\"): {\"marketer\"},        # publishing always waits for a person\n}\n\n\nclass IllegalMove(Exception):\n    pass\n\n\n@dataclass\nclass Campaign:\n    name: str\n    stage: str = \"brief\"\n    holder: str = \"agent\"\n    rounds: int = 0\n    log: list = field(default_factory=list)\n\n    def move(self, to: str, actor: str, note: str = \"\", blocked: bool = False) -> None:\n        allowed = TRANSITIONS.get((self.stage, to))\n        if allowed is None:\n            raise IllegalMove(f\"{self.stage} -> {to} is not a valid move\")\n        if actor not in allowed:\n            raise IllegalMove(f\"{actor} cannot move {self.stage} -> {to}; needs {sorted(allowed)}\")\n        if to == \"review\" and blocked:\n            raise IllegalMove(\"a required rule is failing; it can't be sent for review\")\n        if to == \"review\":\n            self.rounds += 1\n        self.log.append((self.stage, to, actor, note))\n        self.stage = to\n        self.holder = {\"plan\": \"marketer\", \"create\": \"agent\", \"review\": \"reviewer\",\n                       \"approved\": \"marketer\", \"live\": \"nobody\"}.get(to, \"agent\")\n", "live/bridge.py": "\"\"\"Bridge between the copied web demo and the agent core. Runs in the browser under Pyodide.\n\nThe demo describes an ad in its own shape (head, sub, disc, bg, photo, data rows). This module\nturns that into a ContentSpec and hands it to the real code: agent/render.py draws the ad,\nagent/rules.py and the render checks decide what passes, and agent/lessons.py holds what\nLegal has taught. Nothing here makes a decision of its own.\n\"\"\"\nfrom __future__ import annotations\n\nimport json\nfrom datetime import date\n\nfrom agent import BrandRules, ContentSpec, Correction, Figure, LessonStore, check, prereview\nfrom agent.drafter import Brief, TemplateDrafter\nfrom agent.render import check_rendered, render\n\nTODAY = date(2026, 10, 30)\n# The demo's fictional Q4 offer sheet: every rate any demo campaign prints.\nOFFER = {\"auto_refi_apr\": 4.2, \"personal_loan_apr\": 9.9, \"certificate_12m_apy\": 4.0, \"savings_cert_apy\": 4.1,\n         \"balance_transfer_intro_apr\": 0.0, \"mortgage_30y_apr\": 6.1, \"card_cash_back\": 1.5,\n         \"summer_cd_apy\": 4.0}\nOFFER_NAME = \"Q4 offer sheet (Oct 28)\"\nLINES = {\"refi\": \"lending\", \"ploan\": \"lending\", \"mortgage\": \"lending\", \"balance\": \"cards\", \"card\": \"cards\",\n         \"apy\": \"deposits\", \"springcd\": \"deposits\", \"savings\": \"deposits\", \"summer\": \"deposits\", \"info\": \"deposits\",\n         \"youth\": \"deposits\", \"student\": \"deposits\", \"holiday\": \"branch\", \"hours\": \"branch\", \"branch\": \"branch\",\n         \"homeeq\": \"lending\"}\n\nSTORE = LessonStore()\nPLOAN = \"Consolidate at 9.9% APR and lower your monthly payment.\"\n\n\ndef reset() -> str:\n    \"\"\"Restart: Legal's earlier lesson from Oct 22 is the only thing the agent knows.\"\"\"\n    global STORE\n    STORE = LessonStore()\n    l = STORE.learn(Correction(\"Dana Ruiz\", \"legal\", \"sub\", r\"guaranteed \", \"\", \"claim\",\n                               note=\"Avoid 'guaranteed' in lending claims\"), {\"product_line\": \"lending\"}, date(2026, 10, 22))\n    return l.id\n\n\ndef _spec(d: dict) -> ContentSpec:\n    figs = ()\n    if d.get(\"data\"):  # infographic rows: [label, value shown, value on the offer sheet]\n        figs = tuple(Figure(str(r[0]), float(r[1]), f\"chart_{r[0]}\") for r in d[\"data\"])\n    image = None\n    if d.get(\"photoMissing\"):\n        image = \"missing-not-approved\"\n    elif d.get(\"photo\"):\n        image = \"branch-ballard-2026\"\n    return ContentSpec(d.get(\"campaign\", \"Campaign\"), LINES.get(d.get(\"id\", \"\"), \"deposits\"), d.get(\"id\", \"\"),\n                       \"pnw\", d.get(\"head\") or \"\", d.get(\"sub\") or \"\", d.get(\"cta\") or \"Learn more\",\n                       d.get(\"short\") or \"\", d.get(\"disc\") or \"\", \"#FFFFFF\", d.get(\"bg\") or \"#0E4D64\", image, figs)\n\n\ndef _facts(d: dict) -> dict:\n    facts = dict(OFFER)\n    for r in d.get(\"data\") or []:\n        facts[f\"chart_{r[0]}\"] = float(r[2])\n    return facts\n\n\ndef _rules(d: dict) -> BrandRules:\n    return BrandRules(min_contrast=float(d.get(\"min_contrast\", 4.5)), banner_max_chars=int(d.get(\"banner_max\", 30)))\n\n\ndef render_ad(payload: str) -> str:\n    d = json.loads(payload)\n    spec = _spec(d)\n    fmt = \"infographic\" if spec.figures and d[\"fmt\"] != \"leaderboard_728x90\" else d[\"fmt\"]\n    return render(spec, fmt, _rules(d), OFFER_NAME).svg\n\n\ndef check_ad(payload: str) -> str:\n    \"\"\"Every rule and every render check, for the post plus the banner, as the demo's checks panel needs them.\"\"\"\n    d = json.loads(payload)\n    spec, rules, facts = _spec(d), _rules(d), _facts(d)\n    fmts = [\"infographic\", \"leaderboard_728x90\"] if spec.figures else [\"post_1x1\", \"leaderboard_728x90\"]\n    outs = {f: render(spec, f, rules, OFFER_NAME) for f in fmts}\n    found = check(spec, rules, facts) + check_rendered(spec, outs, facts, OFFER_NAME)\n    return json.dumps([{\"rule\": f.rule, \"ok\": f.ok, \"required\": f.required, \"evidence\": f.evidence} for f in found])\n\n\ndef learn_payment_claim() -> str:\n    \"\"\"Dana's correction on the refinance review, scoped to all lending.\"\"\"\n    l = STORE.learn(Correction(\"Dana Ruiz\", \"legal\", \"sub\", r\"and lower your monthly payment\",\n                               \"and you could lower your monthly payment\", \"claim\",\n                               note=\"'could lower', not 'lower', in payment claims\"),\n                    {\"product_line\": \"lending\"}, TODAY)\n    return l.id\n\n\ndef retire(lesson_id: str) -> None:\n    STORE.retire(lesson_id, \"legal\")\n\n\ndef ploan_prereview() -> str:\n    \"\"\"Pre-review the personal-loan draft with whatever lessons are active right now.\"\"\"\n    spec = ContentSpec(\"Personal loan promo\", \"lending\", \"personal_loan\", \"pnw\", \"One payment, less stress\", PLOAN,\n                       disclaimer=\"APR = Annual Percentage Rate. Illustrative offer.\")\n    res = prereview(spec, BrandRules(), STORE, TODAY)\n    lessons = [{\"id\": c.source.split()[1], \"source\": c.source} for c in res.changes if c.kind == \"lesson\"]\n    return json.dumps({\"sub\": res.spec.sub, \"lessons\": lessons})\n\n\ndef directions() -> str:\n    return json.dumps([s.headline for s in TemplateDrafter().directions(Brief(\"Auto loan refinance\", \"auto_refi\"), OFFER)])\n"}</script>
<script>
window.PY = null;
window.PY_BOOT = (async () => {
  const src = JSON.parse(document.getElementById("py-src").textContent);
  const py = await loadPyodide({indexURL: "https://cdn.jsdelivr.net/npm/pyodide@314.0.7/"});
  for (const [p, s] of Object.entries(src)) {
    py.FS.mkdirTree("/app/" + p.split("/").slice(0, -1).join("/"));
    py.FS.writeFile("/app/" + p, s);
  }
  py.runPython('import sys; sys.path.insert(0, "/app/live"); sys.path.insert(0, "/app")');
  const b = py.pyimport("bridge"), cache = new Map();
  const memo = (fn, k) => { if (!cache.has(k)) { if (cache.size > 500) cache.clear(); cache.set(k, fn(k)); } return cache.get(k); };
  window.PY = {
    ad: o => memo(k => b.render_ad(k.slice(2)), "ad" + JSON.stringify(o)),
    checks: o => JSON.parse(memo(k => b.check_ad(k.slice(2)), "ck" + JSON.stringify(o))),
    reset: () => { cache.clear(); return b.reset(); },
    learn: () => b.learn_payment_claim(),
    retire: id => b.retire(id),
    ploan: () => JSON.parse(b.ploan_prereview()),
    directions: () => JSON.parse(b.directions()),
    version: py.runPython("import sys; sys.version.split()[0]"),
  };
})();
// The demo's description of an ad, in the shape agent/render.py and agent/rules.py expect.
function pySp(sp, c) {
  return {id: c ? c.id : (S.drawer || ""), campaign: c ? c.name : "", head: sp.head || "",
    sub: c && c.hideSub ? "" : (sp.sub || ""), cta: sp.cta || "", disc: c && c.hideDisc ? "" : (sp.disc || ""),
    short: sp.short || "", bg: c && c.contrastFixed ? shade(sp.bg) : sp.bg, photo: sp.photo ? 1 : 0,
    photoMissing: sp.photoMissing ? 1 : 0, data: sp.data || null,
    min_contrast: +((S.R && S.R.brand.contrast) || 4.5), banner_max: +((S.R && S.R.brand.banner) || 30)};
}
function pyAd(sp, fmt, w, extra, c) {
  const svg = PY.ad(Object.assign(pySp(sp, c), {fmt}))
    .replace(/width="\d+" height="\d+"/, 'width="100%" style="display:block;height:auto"');
  return `<div class="adbox" data-drawn-by="agent/render.py" title="Drawn by agent/render.py" style="position:relative;width:${w}px;max-width:100%;flex:none">${svg}${extra || ""}</div>`;
}
const PY_FMT = {post: "post_1x1", portrait: "portrait_4x5", story: "story_9x16", d300: "display_300x250", d728: "leaderboard_728x90"};
// Brand checks from agent/rules.py and the render checks, mapped onto the demo's six rows.
function checks(c) {
  const k = checksJS(c);
  if (!window.PY) return k;
  const f = PY.checks(pySp(c.sp, c));
  const pick = p => f.filter(x => p(x.rule));
  const row = (n, list, req, fix, fixl, none) => {
    const bad = list.filter(x => !x.ok);
    return {n, ok: !bad.length, req, ev: list.length ? (bad[0] || list[0]).evidence : none,
            gap: bad.map(x => x.evidence).join("; "), fix, fixl};
  };
  const rules = [
    {n: "Brand fonts", ok: true, ev: "agent/render.py draws brand type only"},
    row("Approved image", pick(r => r === "approved_image" || r.endsWith(":image")), true, "", "Pick an approved image", "No image slot"),
    row("Contrast", pick(r => r === "contrast"), true, "contrast", "Let the Designer darken the background", ""),
    row("Sourced numbers", pick(r => r.startsWith("figure:") || r.includes(":number ") || r.includes(":bar ") || r.endsWith(":source_printed")), true, "source", "Use the source values", "No numbers printed"),
    row("Disclaimer", pick(r => r === "disclaimer" || r.endsWith(":disclaimer_rendered") || r.endsWith(":disclaimer_fit")), true, "adddisc", "Add the disclaimer", ""),
    row("Banner fit", pick(r => r === "banner_fit" || r === "leaderboard_728x90:headline_fit"), false, "shorten", "Let the agent shorten it", ""),
  ];
  return {rules, score: rules.filter(r => r.ok).length, human: k.human, blocked: rules.filter(r => r.req && !r.ok)};
}
</script>

function applyInstruction(c,t){const notes=[];const sp=c.sp;

  if(c.primary&&/^Confirm/.test(c.primary)){c.primary=`Confirm ${nv}`;c.rec=`Updated to ${nv} as you asked`;c.autoPick=null;c.autoAt=null;}}
 const hd=t.match(/headline(?: to| should be|:)\s*[“"']?(.+?)[”"']?$/i);if(hd){sp.head=hd[1].trim();notes.push(`headline → “${sp.head}”`);}
 if(/shorter|shorten/i.test(t)&&!hd){const w=sp.head.split(" ");sp.head=w.slice(0,Math.max(3,Math.ceil(w.length*0.6))).join(" ");notes.push(`shortened the headline to “${sp.head}”`);}

function minsOf(t){if(!t)return 60;const d=t.match(/(\d+)\s*day/);const h=t.match(/(\d+)\s*h/);return (d?+d[1]*1440:0)+(h?+h[1]*60:0)||60;}
function ackAt(c){if(c.ack&&!c.ack.at)c.ack.at=Date.now()+minsOf(c.ack.left)*60000;return c.ack?c.ack.at:null;}
function coolAt(c){if(c.ng&&c.ng.until&&!c.ng.at){const m=c.ng.until.match(/(\d+):(\d\d)\s*(am|pm)?/);let mins=180;if(m){let h=+m[1]%12+(m[3]==="pm"?12:0);mins=Math.max(1,h*60+ +m[2]-CLK);}c.ng.at=Date.now()+mins*60000;}return c.ng&&c.ng.until?c.ng.at:null;}
function fmtCD(ms){const s=Math.max(0,Math.floor(ms/1000));const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60;return d?`${d}d ${h}h ${String(m).padStart(2,"0")}m`:`${h}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}`;}

const GT={person:["People","#8A5300"],lesson:["Lessons","#2F5BEA"],agent:["Agents","#1F7A4D"],scope:["Scope","#5A6270"],campaign:["Campaigns","#B5431A"],source:["Collateral","#0E7490"]};
function buildGraph(){const N={},E=[];const add=(id,type,label,extra)=>{if(!N[id])N[id]=Object.assign({id,type,label},extra||{});return N[id];};
 AGENTS.forEach(a=>{(S.amem[a.r]||[]).forEach((m,i)=>{const L=add(m.id,"lesson",m.x,{m,role:a.r,idx:i});add("a:"+a.r,"agent",a.r,{a});E.push([m.id,"a:"+a.r,"held by"]);
  const pn=m.src.split(" · ")[0];add("p:"+pn,"person",pn,{role:m.src.split(" · ")[1]||""});E.push(["p:"+pn,m.id,"taught"]);
  m.scope.split(" · ").forEach(sc=>{add("s:"+sc,"scope",sc);E.push([m.id,"s:"+sc,"applies to"]);});
  (m.used||[]).forEach(cn=>{add("c:"+cn,"campaign",cn);E.push([m.id,"c:"+cn,"used in"]);});});});
 (S.ctx?S.ctx.sources:[]).forEach(x=>{add("src:"+x.id,"source",x.name.replace(/\.(pdf|zip)$/i,""),{x});x.agents.forEach(r=>{add("a:"+r,"agent",r,{a:AGENTS.find(q=>q.r===r)});E.push(["src:"+x.id,"a:"+r,"feeds"]);});});
 [["Legal pre-reviewer","Copywriter"],["Compliance pre-reviewer","Copywriter"],["Brand pre-reviewer","Designer"]].forEach(([f,t])=>{if(N["a:"+f]){add("a:"+t,"agent",t,{a:AGENTS.find(x=>x.r===t)});E.push(["a:"+f,"a:"+t,"guides"]);}});
 return {N,E};}
function layoutGraph(G){const W=1000,H=640,cx=W/2,cy=H/2;const ids=Object.keys(G.N);const lessons=ids.filter(i=>G.N[i].type==="lesson");
 lessons.forEach((id,k)=>{const ang=-Math.PI/2+k*2*Math.PI/Math.max(1,lessons.length);Object.assign(G.N[id],{ang,x:cx+185*Math.cos(ang),y:cy+150*Math.sin(ang)});});
 const nb=id=>G.E.filter(e=>e[0]===id||e[1]===id).map(e=>e[0]===id?e[1]:e[0]);
 const outer=ids.filter(i=>G.N[i].type!=="lesson");
 const meanAng=id=>{let ls=nb(id).filter(x=>G.N[x].type==="lesson");if(!ls.length)ls=nb(id).flatMap(x=>nb(x)).filter(x=>G.N[x].type==="lesson");if(!ls.length)return 0;let sx=0,sy=0;ls.forEach(l=>{sx+=Math.cos(G.N[l].ang);sy+=Math.sin(G.N[l].ang);});return Math.atan2(sy,sx);};
 outer.forEach(id=>G.N[id].ang=meanAng(id));outer.sort((a,b)=>G.N[a].ang-G.N[b].ang);
 const gap=Math.min(0.42,2*Math.PI/Math.max(1,outer.length));for(let pass=0;pass<4;pass++)for(let i=1;i<outer.length;i++){const p=G.N[outer[i-1]],q=G.N[outer[i]];if(q.ang-p.ang<gap)q.ang=p.ang+gap;}
 const R={person:285,agent:255,scope:300,campaign:290,source:300};outer.forEach((id,i)=>{const n=G.N[id];const r=R[n.type]+(i%2?18:0);n.x=cx+r*Math.cos(n.ang)*1.35;n.y=cy+r*Math.sin(n.ang)*.92;});
 const all=ids.map(i=>G.N[i]);const idx={};all.forEach((n,i)=>idx[n.id]=i);
 for(let it=0;it<320;it++){const fx=all.map(()=>0),fy=all.map(()=>0);
  for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){let dx=all[i].x-all[j].x,dy=(all[i].y-all[j].y)*1.6;let d2=dx*dx+dy*dy+0.01;const f=26000/d2;const d=Math.sqrt(d2);fx[i]+=f*dx/d;fy[i]+=f*dy/d;fx[j]-=f*dx/d;fy[j]-=f*dy/d;}
  G.E.forEach(([a,b])=>{const A=all[idx[a]],B=all[idx[b]];const dx=B.x-A.x,dy=B.y-A.y;const d=Math.sqrt(dx*dx+dy*dy)+0.01;const f=(d-170)*0.03;fx[idx[a]]+=f*dx/d;fy[idx[a]]+=f*dy/d;fx[idx[b]]-=f*dx/d;fy[idx[b]]-=f*dy/d;});
  all.forEach((n,i)=>{const g=n.type==="lesson"?0.008:0.002;fx[i]+=(cx-n.x)*g;fy[i]+=(cy-n.y)*g;const step=it<200?1:0.5;n.x=Math.max(70,Math.min(930,n.x+Math.max(-12,Math.min(12,fx[i]))*step));n.y=Math.max(30,Math.min(600,n.y+Math.max(-12,Math.min(12,fy[i]))*step));});}
 return G;}

const THESES={1:["Thesis 1","Long-horizon agent","#8FB0FF"],2:["Thesis 2","Coach the agents","#8FE0B5"],3:["Thesis 3","Review is the product","#C9B3F5"],0:["All three","Measured","#F2C27A"]};
const GUIDE=[
 ["started","Pick Auto loan refinance, choose a launch date, then Start",1,1,"One brief starts a campaign the agent carries for days.","Thesis 1 · Long-horizon agent"],
 ["plan","Open the plan in Needs you, pick a direction and approve it",1,1,"You make decisions; the agent does the tasks.","Thesis 1 · Long-horizon agent"],
 ["info","Run the Rates infographic scenario, then open it",1,1,"Every figure is checked against the offer sheet; a wrong number blocks sending until it matches.","Thesis 1 · Long-horizon agent"],
 ["history","In Campaign status, open a campaign’s timeline",1,0,"Every handoff is logged while the agent waits on people.","Thesis 1 · Long-horizon agent"],
 ["asked","Run the Credit card launch scenario",1,0,"It asks about regulated terms instead of guessing.","Thesis 1 · Long-horizon agent"],
 ["adapt","Open a campaign and switch to Display 728×90",1,0,"Each size is re-laid out, disclaimer included, not resized.","Thesis 1 · Long-horizon agent"],
 ["fixed","Hide the disclaimer, see “Blocks sending”, then use the one-click fix",1,0,"Required rules block sending; the agent fixes them in one click.","Thesis 1 · Long-horizon agent"],
 ["scheduled","Hand off an approved package from Needs you",1,0,"It runs to the finish line; publishing stays in your scheduler.","Thesis 1 · Long-horizon agent"],
 ["agents","Agent team: switch “Viewing as” between reviewers",2,1,"Each reviewer owns their specialist’s job description.","Thesis 2 · Coach the agents"],
 ["why","In a campaign, turn on “Why it looks like this”",2,1,"Every change cites the lesson and who taught it.","Thesis 2 · Coach the agents"],

 ["graph","Context graph (P1): trace a lesson to who taught it and where it was used",2,0,"Coaching is visible and auditable.","Thesis 2 · Coach the agents"],

 ["reviewed","Open Dana’s review link: pin a claim correction with a reason, or tap the agent’s fix",3,1,"One decision, not a file, and no login. Her reason decides what the agent learns.","Thesis 3 · Review is the product"],
 ["nudged","Nudge a reviewer: pick the message and channel",3,1,"The agent chases on the due date and respects commitments.","Thesis 3 · Review is the product"],
 ["conflict","Resolve Student checking’s conflicting feedback",3,0,"Conflicts come back to the marketer instead of being guessed.","Thesis 3 · Review is the product"],
 ["learned","Start the Personal loan promo scenario",2,1,"Dana’s lesson is applied before she sees it. Retire the lesson first and she has to repeat herself.","Payoff"],
 ["insights","Open Insights",0,0,"How the pilot would be measured (worked example on seeded data).","Payoff"]];
function drawGuide(){const f=S.flags;let cur=GUIDE.findIndex(g=>g[3]&&!f[g[0]]);if(cur<0)cur=GUIDE.findIndex(g=>!f[g[0]]);const done=GUIDE.filter(g=>f[g[0]]).length;
 const chip=th=>{const T=THESES[th];return `<span style="display:inline-flex;align-self:flex-start;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:${T[2]}26;color:${T[2]}"><span style="width:6px;height:6px;border-radius:50%;background:${T[2]}"></span>${T[0]}${th?` · ${T[1]}`:""}</span>`;};
 const prog=[1,2,3].map(th=>{const c=GUIDE.filter(g=>g[2]===th&&g[3]);const d=c.filter(g=>f[g[0]]).length;const T=THESES[th];return `<div title="${T[0]}: ${T[1]} · ${d} of ${c.length}" style="flex:1;display:flex;flex-direction:column;gap:3px;min-width:0"><span style="font-size:9.5px;font-weight:700;letter-spacing:.04em;color:${T[2]};white-space:nowrap;overflow:hidden">T${th} <span style="opacity:.75">${d}/${c.length}</span></span><span style="height:5px;border-radius:999px;background:#2C3442;overflow:hidden"><span style="display:block;height:100%;width:${Math.round(100*d/c.length)}%;background:${T[2]};transition:width .4s"></span></span></div>`;}).join("");
 const all=S.guideOpen;let h=`<div style="display:flex;align-items:center;gap:8px;white-space:nowrap"><b style="color:#fff;font-size:13px">Demo guide</b><span style="margin-left:auto;color:#8D96A5;font-weight:600">${done}/${GUIDE.length}</span></div><div style="display:flex;gap:6px">${prog}</div>`;
 if(cur<0)h+=`<div class="gcur" style="border-color:rgba(159,226,191,.5);background:rgba(31,122,77,.18)"><span class="k" style="color:#9FE2BF">All done</span><span class="t">You’ve shown all three theses: the agent carries the campaign, reviewers coach their agents, and review shrinks to one decision.</span></div>`;
 else{const g=GUIDE[cur];h+=`<div class="gcur" style="border-color:${THESES[g[2]][2]}80"><span class="k">Step ${cur+1} · up next</span>${chip(g[2])}<span class="t">${g[1]}</span><span style="font-size:11.5px;color:#C3C9D3;line-height:1.35"><b style="color:${THESES[g[2]][2]}">Proves:</b> ${g[4]}</span></div>`;}
 const row=(g,i)=>`<div class="gnext ${f[g[0]]?"done":""}" ${i===cur?'style="color:#fff;font-weight:600"':""}><span class="d" ${i===cur?`style="border-color:${THESES[g[2]][2]};background:${THESES[g[2]][2]};color:#0B1020"`:""}>${f[g[0]]?"✓":i+1}</span><span>${g[1]}${g[3]?"":` <span style="color:#6B7482">(optional)</span>`}</span></div>`;
 if(all){let lastCh="";h+=`<div style="display:flex;flex-direction:column;gap:7px;max-height:46vh;overflow-y:auto;padding-right:4px">${GUIDE.map((g,i)=>{let hd="";if(g[5]!==lastCh){lastCh=g[5];const col=g[5]==="Payoff"?THESES[0][2]:THESES[g[2]][2];hd=`<span style="font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:${col};font-weight:700;margin-top:${i?6:0}px">${g[5]}</span>`;}return hd+row(g,i);}).join("")}</div>`;}
 else{const list=GUIDE.map((g,i)=>[g,i]).filter(([g,i])=>i>cur&&g[3]&&!f[g[0]]).slice(0,2);if(list.length)h+=`<div style="display:flex;flex-direction:column;gap:6px"><span style="font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#6B7482;font-weight:600">Then</span>${list.map(([g,i])=>row(g,i)).join("")}</div>`;}
 $("glist").innerHTML=h;$("gstate").textContent=`${done} of ${GUIDE.length}`;const t=$("gtoggle");if(t)t.textContent=all?"Show less":`All ${GUIDE.length} steps`;}
