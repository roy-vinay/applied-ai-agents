<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Fix the ad versus teach the agent. Fixing only the ad: Dana makes the same payment-claim correction on the auto loan, the personal loan and the mortgage; 104 repeat corrections a quarter, 1.84 review rounds per campaign. Teaching her Legal agent: the correction becomes a lesson scoped to lending; the personal loan arrives already fixed, and the certificate is left alone because it is out of scope; 3 repeat corrections, 1.31 rounds, zero out-of-scope edits.">
<rect width="1200" height="560" fill="#FFFFFF"/>
<text x="40" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#59636E" text-anchor="start">WHAT A REVIEWER&#x27;S CORRECTION DOES</text>
<text x="1160" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636E" text-anchor="end">Dana (Legal) strikes “lower your monthly payment” on the auto loan</text>
<line x1="40" y1="58" x2="1160" y2="58" stroke="#D0D7DE"/>
<rect x="40" y="76" width="540" height="456" rx="16" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/>
<text x="64" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#1F2328" text-anchor="start">Fix the ad</text>
<text x="64" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#59636E" text-anchor="start">“This campaign only.” The agent learns nothing.</text>
<rect x="64" y="156" width="492" height="78" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1"/>
<text x="80" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2328" text-anchor="start">Auto loan refinance</text>
<text x="80" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#B42318" text-anchor="start">Dana corrects the payment claim</text>
<text x="80" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636E" text-anchor="start">round 2 for this campaign</text>
<rect x="64" y="246" width="492" height="78" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1"/>
<text x="80" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2328" text-anchor="start">Personal loan</text>
<text x="80" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#B42318" text-anchor="start">Same claim again. Dana corrects it again</text>
<text x="80" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636E" text-anchor="start">the agent didn&#x27;t know</text>
<rect x="64" y="336" width="492" height="78" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="1"/>
<text x="80" y="362" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2328" text-anchor="start">Mortgage refinance</text>
<text x="80" y="384" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#B42318" text-anchor="start">And again</text>
<text x="80" y="402" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636E" text-anchor="start">every lending campaign, every quarter</text>
<text x="64" y="466" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#B42318" text-anchor="start">104</text>
<text x="64" y="488" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636E" text-anchor="start">repeat fixes a quarter</text>
<text x="236" y="466" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#B42318" text-anchor="start">1.84</text>
<text x="236" y="488" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636E" text-anchor="start">rounds per campaign</text>
<text x="408" y="466" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#B42318" text-anchor="start">31%</text>
<text x="408" y="488" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636E" text-anchor="start">first-pass approval</text>
<rect x="620" y="76" width="540" height="456" rx="16" fill="#FFFFFF" stroke="#C2410C" stroke-width="2"/>
<text x="644" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#1F2328" text-anchor="start">Teach the agent</text>
<text x="644" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#59636E" text-anchor="start">“Teach my Legal agent: all lending.” Owned by Legal.</text>
<rect x="644" y="156" width="492" height="78" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="1"/>
<text x="660" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2328" text-anchor="start">Auto loan refinance</text>
<text x="660" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#C2410C" text-anchor="start">Dana corrects it and teaches her agent</text>
<text x="660" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636E" text-anchor="start">lesson: “could lower”, not “lower” · lending · owner Legal</text>
<rect x="644" y="246" width="492" height="78" rx="10" fill="#E3F4EA" stroke="#1F7A4D" stroke-width="1"/>
<text x="660" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2328" text-anchor="start">Personal loan</text>
<text x="660" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1F7A4D" text-anchor="start">Arrives already fixed</text>
<text x="660" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636E" text-anchor="start">the asset cites Dana&#x27;s lesson as the reason</text>
<rect x="644" y="336" width="492" height="78" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
<text x="660" y="362" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2328" text-anchor="start">Certificate</text>
<text x="660" y="384" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#59636E" text-anchor="start">Left alone: out of scope</text>
<text x="660" y="402" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636E" text-anchor="start">“guaranteed” is accurate on a fixed rate</text>
<text x="644" y="466" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#1F7A4D" text-anchor="start">3</text>
<text x="644" y="488" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636E" text-anchor="start">repeat fixes a quarter</text>
<text x="816" y="466" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#1F7A4D" text-anchor="start">1.31</text>
<text x="816" y="488" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636E" text-anchor="start">rounds per campaign</text>
<text x="988" y="466" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#1F7A4D" text-anchor="start">0</text>
<text x="988" y="488" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636E" text-anchor="start">out-of-scope edits</text>
<text x="40" y="552" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636E" text-anchor="start">Seeded replay of 120 campaigns, simulated reviewers. Without scope, the same lessons make 18 wrong edits a quarter.</text>
<text x="1160" y="552" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400" fill="#59636E" text-anchor="end">benchmark/replay.py · agent/review.py</text>
</svg>
