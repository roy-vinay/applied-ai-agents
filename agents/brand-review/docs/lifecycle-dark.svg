<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="Campaign lifecycle. Brief, held by the agent, moves to Plan when the agent drafts it. The marketer approves the plan to move it to Create, held by the agent, which fixes its own failed self-checks. Only the marketer can send it to Review, and only when every required check passes. A reviewer either requests a change, which sends it back to Create and adds a round, or approves it. Conflicting reviewers go to the marketer. Only a person moves Approved to Live; the agent never publishes. Illegal moves raise an error and are tested in CI.">
<defs><marker id="m-arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198A1"/></marker><marker id="m-accent-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF8A3D"/></marker><marker id="m-agent-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6F95FF"/></marker><marker id="m-marketer-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F2B04A"/></marker><marker id="m-reviewer-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B596F0"/></marker></defs>
