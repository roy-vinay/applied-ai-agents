<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Brand Review architecture. A brief, the offer sheet and versioned brand rules feed the agent core: the drafter writes copy, pre-review applies reviewers' lessons and safe rule fixes, the renderer draws every format, and render checks verify what was drawn. The marketer sends; reviewers decide on a no-login link; each correction becomes a scoped lesson; approved packages go to the system of record. A campaign workflow tracks every stage.">
