<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-label="Refinance your auto loan and save"><rect width="1080" height="1920" fill="#0E4D64"/><text x="90" y="150" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Harbor &amp; Pine</text><rect x="90" y="200" width="900" height="560" rx="8" fill="#FFFFFF" fill-opacity="0.18"/><text x="106" y="742" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" fill="#FFFFFF" fill-opacity="0.8">approved image: family-car-01</text><text x="90" y="941" font-family="Georgia, 'Times New Roman', serif" font-size="120" font-weight="700" fill="#FFFFFF" text-anchor="start">Refinance</text><text x="90" y="1075" font-family="Georgia, 'Times New Roman', serif" font-size="120" font-weight="700" fill="#FFFFFF" text-anchor="start">your auto</text><text x="90" y="1210" font-family="Georgia, 'Times New Roman', serif" font-size="120" font-weight="700" fill="#FFFFFF" text-anchor="start">loan and save</text><text x="90" y="1322" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="400" fill="#FFFFFF" text-anchor="start">Refinance at 4.2% APR and you could</text><text x="90" y="1379" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="400" fill="#FFFFFF" text-anchor="start">lower your monthly payment.</text><rect x="90" y="1520" width="460" height="100" rx="50" fill="#B5431A"/><text x="320.0" y="1585" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF">See your new rate</text><text x="90" y="1768" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#FFFFFF" text-anchor="start">APR = Annual Percentage Rate. Rates and terms subject to</text><text x="90" y="1799" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#FFFFFF" text-anchor="start">approval.</text></svg>
