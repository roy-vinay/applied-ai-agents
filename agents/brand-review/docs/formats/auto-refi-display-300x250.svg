<svg xmlns="http://www.w3.org/2000/svg" width="300" height="250" viewBox="0 0 300 250" role="img" aria-label="Refinance your auto loan and save"><rect width="300" height="250" fill="#0E4D64"/><text x="16" y="26" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Harbor &amp; Pine</text><text x="16" y="66" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="start">Refinance your</text><text x="16" y="95" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="start">auto loan and save</text><text x="16" y="151" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="start">Refinance at 4.2% APR and you could</text><text x="16" y="167" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="start">lower your monthly payment.</text><rect x="16" y="184" width="130" height="30" rx="15" fill="#B5431A"/><text x="81.0" y="203" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">See your new rate</text><text x="16" y="229" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="8" font-weight="400" fill="#FFFFFF" text-anchor="start">APR = Annual Percentage Rate. Rates and terms subject to</text><text x="16" y="238" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="8" font-weight="400" fill="#FFFFFF" text-anchor="start">approval.</text></svg>
