<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="Certificate rates at a glance"><rect width="1080" height="1350" fill="#7C5A2E"/><text x="80" y="100" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">Harbor &amp; Pine</text><text x="80" y="239" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="700" fill="#FFFFFF" text-anchor="start">Certificate rates</text><text x="80" y="337" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="700" fill="#FFFFFF" text-anchor="start">at a glance</text><text x="80" y="400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="400" fill="#FFFFFF" text-anchor="start">Pick the term that fits your plans.</text><rect x="80" y="614" width="258" height="486" rx="10" fill="#FFFFFF" fill-opacity="0.92"/><text x="209" y="594" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="700" fill="#FFFFFF">3.6%</text><text x="209" y="1146" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" fill="#FFFFFF">6-month</text><rect x="411" y="560" width="258" height="540" rx="10" fill="#FFFFFF" fill-opacity="0.92"/><text x="540" y="540" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="700" fill="#FFFFFF">4.0%</text><text x="540" y="1146" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" fill="#FFFFFF">12-month</text><rect x="742" y="587" width="258" height="513" rx="10" fill="#FFFFFF" fill-opacity="0.92"/><text x="871" y="567" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="700" fill="#FFFFFF">3.8%</text><text x="871" y="1146" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" fill="#FFFFFF">24-month</text><text x="80" y="1186" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="start">Source: Q4 offer sheet, Oct 28.</text><text x="80" y="1236" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#FFFFFF" text-anchor="start">APR = Annual Percentage Rate. Rates and terms subject to approval.</text></svg>
