name: mdeditdiff-release
# Publishes a GitHub Release whenever main has an mdEditDiff version that hasn't been released yet.
# To release: bump the version in package.json, src/version.ts and app/Info.plist, add a CHANGELOG
# entry, and merge to main. The workflow creates the tag mdeditdiff-v<version> and the release.
on:
  push:
    branches: [main]
    paths:
      - "tools/mdeditdiff/package.json"
      - ".github/workflows/mdeditdiff-release.yml"
permissions:
  contents: write
concurrency:
  group: mdeditdiff-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    defaults:
      run:
        working-directory: tools/mdeditdiff
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Read the version and skip if already released
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APP=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" app/Info.plist)
          CLI=$(sed -n 's/.*VERSION = "\(.*\)".*/\1/p' src/version.ts)
          echo "package=$VERSION app=$APP cli=$CLI"
          [ "$VERSION" = "$APP" ] && [ "$VERSION" = "$CLI" ] || { echo "::error::Version mismatch: package.json $VERSION, Info.plist $APP, src/version.ts $CLI"; exit 1; }
          grep -q "^## $VERSION$" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $VERSION' section"; exit 1; }
          TAG="mdeditdiff-v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Test and pack the command-line tool
        if: steps.version.outputs.skip != 'true'
        run: |
          npm ci
          npm test
          npm pack
          mv "mdeditdiff-$VERSION.tgz" mdeditdiff-cli.tgz
      - name: Test and build the Mac app
        if: steps.version.outputs.skip != 'true'
        working-directory: tools/mdeditdiff/app
        run: |
          swift test
          ./scripts/build-app.sh
          cp build/mdEditDiff-macOS.zip ../mdEditDiff-macOS.zip
      - name: Checksums
        if: steps.version.outputs.skip != 'true'
        run: shasum -a 256 mdEditDiff-macOS.zip mdeditdiff-cli.tgz > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes
        if: steps.version.outputs.skip != 'true'
        run: |
          {
            echo "## Install"
            echo
            echo "**Mac app** (macOS 14 or later): download **mdEditDiff-macOS.zip** below, unzip it, and drag **mdEditDiff.app** into Applications. The app isn't notarized yet, so the first time macOS says it \"could not verify\" the app: click **Done**, then open **System Settings > Privacy & Security** and click **Open Anyway** (or run \`xattr -dr com.apple.quarantine /Applications/mdEditDiff.app\`)."
            echo
            echo "**Command-line tool and MCP server** (Node.js 20 or later):"
            echo
            echo '```bash'
            echo "npm install -g https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/mdeditdiff-cli.tgz"
            echo "claude mcp add mdeditdiff -- mdeditdiff mcp   # optional: connect it to Claude Code"
            echo '```'
            echo
            echo "Install both to get change tracking in the app. Docs: https://github.com/${GITHUB_REPOSITORY}/tree/main/tools/mdeditdiff"
            echo
            # The changelog section for this version.
            awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md
          } > release-notes.md
          cat release-notes.md
      - name: Publish the release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" mdEditDiff-macOS.zip mdeditdiff-cli.tgz SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "mdEditDiff $VERSION" --notes-file release-notes.md
