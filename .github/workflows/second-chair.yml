name: second-chair
# Pull requests are tested; main packages and publishes the code its pull request already tested.
on:
  push:
    branches: [main]
    paths: ["tools/second-chair/**", ".github/workflows/second-chair.yml"]
  pull_request:
    paths: ["tools/second-chair/**", ".github/workflows/second-chair.yml"]
jobs:
  app:
    # macOS 26: the SDK for Apple's on-device model, and the app's minimum macOS.
    runs-on: macos-26
    permissions:
      contents: write
    defaults:
      run:
        working-directory: tools/second-chair
    steps:
      - uses: actions/checkout@v5
        with:
          # On a pull request, the branch itself, so screenshots can be committed back to it.
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - name: Reuse compiled files from earlier runs
        uses: actions/cache@v4
        with:
          path: tools/second-chair/.build
          key: second-chair-build-${{ runner.os }}-${{ hashFiles('tools/second-chair/Package.swift', 'tools/second-chair/Sources/**', 'tools/second-chair/Tests/**') }}
          restore-keys: second-chair-build-${{ runner.os }}-
      - name: Build and test
        run: |
          set -o pipefail
          report() {
            grep -E "error:|XCTAssert|failed \\(" "$1" | grep -v "emit-module command failed" | sort -u | head -25 | while IFS= read -r line; do
              if [[ "$line" =~ ^(/[^:]+):([0-9]+):([0-9]+):\ (error|warning):\ (.*)$ ]]; then
                f="${BASH_REMATCH[1]#$GITHUB_WORKSPACE/}"
                echo "::error file=$f,line=${BASH_REMATCH[2]},col=${BASH_REMATCH[3]}::${BASH_REMATCH[5]}"
              else
                echo "::error::${line//%/%25}"
              fi
            done
          }
          swift build 2>&1 | tee build.log || { report build.log; exit 1; }
          swift test 2>&1 | tee test.log || { report test.log; exit 1; }
      - name: Package the app
        run: ./scripts/build-app.sh
      - name: Launch smoke test
        run: |
          "./build/Second Chair.app/Contents/MacOS/SecondChair" &
          PID=$!
          sleep 8
          if kill -0 $PID 2>/dev/null; then echo "App is running"; kill $PID; else echo "::error title=Launch failed::The app exited within 8 seconds"; exit 1; fi
      - name: The overlay is excluded from screen capture
        run: '"./build/Second Chair.app/Contents/MacOS/SecondChair" --window-check'
      - name: Screenshots of the main states (for design review)
        run: |
          "./build/Second Chair.app/Contents/MacOS/SecondChair" --screenshots "$PWD/shots" --corpus "$PWD/examples/prep-pack" &
          PID=$!
          for i in $(seq 1 90); do kill -0 $PID 2>/dev/null || break; sleep 1; done
          kill $PID 2>/dev/null || true
          ls -la shots || true
      - name: Commit screenshots to the branch (not main)
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p docs/img && cp shots/*.png docs/img/ 2>/dev/null || true
          git config user.name "Vinay Roy"
          git config user.email "roy-vinay@users.noreply.github.com"
          git add docs/img/*.png
          if git diff --cached --quiet; then echo "No screenshot changes"; exit 0; fi
          git commit -m "Second Chair docs: app screenshots"
          git push origin "HEAD:$GITHUB_HEAD_REF"
      - name: Gate on the sample prep pack, keyword only, no models (deterministic)
        run: |
          set -o pipefail
          "./build/Second Chair.app/Contents/MacOS/SecondChair" --gate examples/gate-questions.json --corpus examples/prep-pack --report gate-keyword.md | tee gate.log
          cat gate-keyword.md >> "$GITHUB_STEP_SUMMARY"
      - name: Gate with Apple sentence embeddings (reported, not required)
        continue-on-error: true
        run: |
          "./build/Second Chair.app/Contents/MacOS/SecondChair" --gate examples/gate-questions.json --corpus examples/prep-pack --embeddings apple --report gate-apple.md || true
          { echo; echo "### With Apple sentence embeddings"; cat gate-apple.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Installer script syntax
        run: bash -n install.sh
      - name: Publish the latest build as a release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=second-chair-latest
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Info.plist)
          NOTES="Latest Second Chair build from main, version $VERSION ($(git rev-parse --short HEAD)). Apple silicon, macOS 26 or later. Install or update with: curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/tools/second-chair/install.sh | bash"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES" --target "$GITHUB_SHA" --prerelease=false
            git push -f origin "HEAD:refs/tags/$TAG"
          else
            gh release create "$TAG" --title "Second Chair (latest build)" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" build/SecondChair-macOS.zip --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: SecondChair-macOS
          path: tools/second-chair/build/SecondChair-macOS.zip
