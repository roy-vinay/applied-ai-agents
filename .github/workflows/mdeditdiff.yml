name: mdeditdiff
on:
  push:
    paths: ["tools/mdeditdiff/**", ".github/workflows/mdeditdiff.yml"]
  pull_request:
    paths: ["tools/mdeditdiff/**", ".github/workflows/mdeditdiff.yml"]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/mdeditdiff
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: tools/mdeditdiff/package-lock.json
      - run: npm ci
      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log || {
            msg=$(grep -A30 '^not ok' test.log | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Test failures::$msg"
            exit 1
          }
      - name: CLI smoke test
        run: |
          printf '# Plan\n\n- one\n' > /tmp/plan.md
          node dist/src/cli.js changes /tmp/plan.md --reader ci
          printf '# Plan\n\n- one\n- two\n' > /tmp/plan.md
          node dist/src/cli.js changes /tmp/plan.md --reader ci | grep -q "1 change"

  app:
    runs-on: macos-15
    defaults:
      run:
        working-directory: tools/mdeditdiff/app
    steps:
      - uses: actions/checkout@v5
      - name: Build and test
        run: |
          set -o pipefail
          swift --version
          { swift build 2>&1 && swift test 2>&1; } | tee build.log || {
            msg=$(grep -E "error:|failed|XCTAssert" build.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Swift build or test failed::$msg"
            exit 1
          }
      - name: Package the app
        run: |
          set -o pipefail
          ./scripts/build-app.sh 2>&1 | tee package.log || {
            msg=$(grep -E "error:|warning: unable" package.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Packaging failed::$msg"
            exit 1
          }
      - name: Launch smoke test
        run: |
          ./build/mdEditDiff.app/Contents/MacOS/MDEditDiff &
          PID=$!
          sleep 8
          if kill -0 $PID 2>/dev/null; then echo "App is running"; kill $PID; else echo "::error title=Launch failed::The app exited within 8 seconds"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: mdEditDiff-macOS
          path: tools/mdeditdiff/app/build/mdEditDiff-macOS.zip
