name: mdeditdiff
on:
  push:
    paths: ["tools/mdeditdiff/**", ".github/workflows/mdeditdiff.yml"]
  pull_request:
    paths: ["tools/mdeditdiff/**", ".github/workflows/mdeditdiff.yml"]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/mdeditdiff
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: tools/mdeditdiff/package-lock.json
      - run: npm ci
      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log || {
            msg=$(grep -A30 '^not ok' test.log | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Test failures::$msg"
            exit 1
          }
      - name: CLI smoke test
        run: |
          printf '# Plan\n\n- one\n' > /tmp/plan.md
          node dist/src/cli.js changes /tmp/plan.md --reader ci
          printf '# Plan\n\n- one\n- two\n' > /tmp/plan.md
          node dist/src/cli.js changes /tmp/plan.md --reader ci | grep -q "1 change"
