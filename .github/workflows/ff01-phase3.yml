name: ff01-phase3
# Runs on free GitHub runners with local open models: no API keys, no cost.
# Start it from the Actions tab (pick a step), or by pushing a change to phase3/run_request.txt
# with one step per line:
#   answers     the three models answer the 100 frozen test questions
#   judge-dev   the judge checks the Phase 2 answers (used to build and tune it)
#   judge-test  the judge checks the test answers (refuses to run until the judge is frozen)
on:
  workflow_dispatch:
    inputs:
      step:
        description: "answers, judge-dev, or judge-test"
        type: choice
        options: [answers, judge-dev, judge-test]
  push:
    branches: [main]
    paths: ["failure-files/ff-01-unsupported-policy-claims/phase3/run_request.txt"]
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      steps: ${{ steps.p.outputs.steps }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          if [ -n "${{ inputs.step }}" ]; then s='["${{ inputs.step }}"]'
          else s=$(grep -E '^(answers|judge-dev|judge-test)$' failure-files/ff-01-unsupported-policy-claims/phase3/run_request.txt | jq -R . | jq -sc .)
          fi
          echo "steps=$s" >> "$GITHUB_OUTPUT"; echo "$s"
  run:
    needs: plan
    if: needs.plan.outputs.steps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        step: ${{ fromJSON(needs.plan.outputs.steps) }}
        model: ["ollama:llama3.2:3b", "ollama:qwen2.5:3b", "ollama:gemma2:2b"]
        shard: [0, 1, 2]   # judge steps split each model's answers three ways; answers use shard 0 only
    defaults:
      run:
        working-directory: failure-files/ff-01-unsupported-policy-claims/phase3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ollama
        if: matrix.step != 'answers' || matrix.shard == 0
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama and pull the model this step needs
        if: matrix.step != 'answers' || matrix.shard == 0
        run: |
          (ollama serve > /tmp/ollama.log 2>&1 &)
          sleep 5
          if [ "${{ matrix.step }}" = "answers" ]; then m="${{ matrix.model }}"; else m="ollama:qwen2.5:7b"; fi
          ollama pull "${m#ollama:}"
      - name: Run
        if: matrix.step != 'answers' || matrix.shard == 0
        run: |
          step="${{ matrix.step }}"
          if [ "$step" = "answers" ]; then
            python -u run_test_answers.py --models "${{ matrix.model }}"
          else
            python -u judge.py --split "${step#judge-}" --answer-models "${{ matrix.model }}" --shard "${{ matrix.shard }}/3"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3-${{ github.run_id }}-${{ strategy.job-index }}
          path: |
            failure-files/ff-01-unsupported-policy-claims/phase3/test
            failure-files/ff-01-unsupported-policy-claims/phase3/dev
          if-no-files-found: warn
      - name: Commit results
        if: always()
        run: |
          git config user.name "Vinay Roy"
          git config user.email "vroy@berkeley.edu"
          for d in test dev; do [ -d "$d" ] && git add -A "$d"; done
          git status --short
          git commit -m "FF-01 Phase 3: ${{ matrix.step }} for ${{ matrix.model }} (part ${{ matrix.shard }})" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase && git push && exit 0; sleep $((RANDOM % 30 + 5)); done
          exit 1
