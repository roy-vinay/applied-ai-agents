name: ff01-phase3
# Manual only. Runs on free GitHub runners with local open models: no API keys, no cost.
#   answers     the three models answer the 100 frozen test questions
#   judge-dev   the judge checks the Phase 2 answers (used to build and tune it)
#   judge-test  the judge checks the test answers (refuses to run until the judge is frozen)
on:
  workflow_dispatch:
    inputs:
      step:
        description: "answers, judge-dev, or judge-test"
        type: choice
        options: [answers, judge-dev, judge-test]
permissions:
  contents: write
concurrency:
  group: ff01-phase3-${{ inputs.step }}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        model: ["ollama:llama3.2:3b", "ollama:qwen2.5:3b", "ollama:gemma2:2b"]
    defaults:
      run:
        working-directory: failure-files/ff-01-unsupported-policy-claims/phase3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama and pull the model this step needs
        run: |
          (ollama serve > /tmp/ollama.log 2>&1 &)
          sleep 5
          if [ "${{ inputs.step }}" = "answers" ]; then m="${{ matrix.model }}"; else m="ollama:qwen2.5:7b"; fi
          ollama pull "${m#ollama:}"
      - name: Run
        run: |
          if [ "${{ inputs.step }}" = "answers" ]; then
            python -u run_test_answers.py --models "${{ matrix.model }}"
          else
            step="${{ inputs.step }}"
            python -u judge.py --split "${step#judge-}" --answer-models "${{ matrix.model }}"
          fi
      - name: Commit results
        if: always()
        run: |
          git config user.name "Vinay Roy"
          git config user.email "vroy@berkeley.edu"
          git add -A test dev 2>/dev/null || true
          git commit -m "FF-01 Phase 3: ${{ inputs.step }} for ${{ matrix.model }}" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep $((RANDOM % 20 + 5)); done
          exit 1
