name: speakernotes
# Pull requests are tested; main only packages and publishes the code its pull request already tested.
on:
  push:
    branches: [main]
    paths: ["tools/speakernotes/**", ".github/workflows/speakernotes.yml"]
  pull_request:
    paths: ["tools/speakernotes/**", ".github/workflows/speakernotes.yml"]
jobs:
  app:
    # macOS 26 has the SDK for Apple's on-device model; the app itself still opens on macOS 13.
    runs-on: macos-26
    permissions:
      contents: write
    defaults:
      run:
        working-directory: tools/speakernotes
    steps:
      - uses: actions/checkout@v5
        with:
          # On a pull request, the branch itself, so screenshots can be committed back to it.
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - name: Reuse compiled files from earlier runs
        uses: actions/cache@v4
        with:
          path: tools/speakernotes/.build
          key: speakernotes-build-${{ runner.os }}-${{ hashFiles('tools/speakernotes/Package.swift', 'tools/speakernotes/Sources/**', 'tools/speakernotes/Tests/**') }}
          restore-keys: speakernotes-build-${{ runner.os }}-
      - name: Build and test
        if: github.event_name == 'pull_request'
        run: |
          set -o pipefail
          report() {
            # One annotation per compiler error or failed assertion, with its file and line.
            grep -E "error:|XCTAssert|failed \\(" "$1" | grep -v "emit-module command failed" | sort -u | head -25 | while IFS= read -r line; do
              if [[ "$line" =~ ^(/[^:]+):([0-9]+):([0-9]+):\ (error|warning):\ (.*)$ ]]; then
                f="${BASH_REMATCH[1]#$GITHUB_WORKSPACE/}"
                echo "::error file=$f,line=${BASH_REMATCH[2]},col=${BASH_REMATCH[3]}::${BASH_REMATCH[5]}"
              else
                echo "::error::${line//%/%25}"
              fi
            done
          }
          swift build 2>&1 | tee build.log || { report build.log; exit 1; }
          swift test 2>&1 | tee test.log || { report test.log; exit 1; }
      - name: Package the app
        run: ./scripts/build-app.sh
      - name: The on-device model framework is weak-linked (so older macOS can still open the app)
        run: |
          otool -l build/SpeakerNotes.app/Contents/MacOS/SpeakerNotes | grep -B2 FoundationModels || true
          if otool -l build/SpeakerNotes.app/Contents/MacOS/SpeakerNotes | grep -B2 "FoundationModels" | grep -q "LC_LOAD_DYLIB$"; then
            echo "::error title=Linking::FoundationModels is strongly linked; the app would not open before macOS 26"
            exit 1
          fi
      - name: Launch smoke test
        run: |
          ./build/SpeakerNotes.app/Contents/MacOS/SpeakerNotes &
          PID=$!
          sleep 8
          if kill -0 $PID 2>/dev/null; then echo "App is running"; kill $PID; else echo "::error title=Launch failed::The app exited within 8 seconds"; exit 1; fi
      - name: Slide following reads the right slide off the screen (on-device text recognition)
        run: |
          set -o pipefail
          ./build/SpeakerNotes.app/Contents/MacOS/SpeakerNotes --match-image examples/sample-slide.png examples/sample-talk.md | tee match.log
          grep -q 'matched slide 2 ' match.log || { echo "::error title=Slide matching::expected the sample slide to match notes slide 2"; exit 1; }
      - name: Installer script syntax
        run: bash -n install.sh
      - name: Screenshots, and a check that the window stays out of a full-screen capture
        if: github.event_name == 'pull_request'
        run: ./scripts/screenshots.sh
      - name: Commit screenshots to the branch (not main)
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "Vinay Roy"
          git config user.email "roy-vinay@users.noreply.github.com"
          git add docs/img/*.png docs/img/demo/*.png
          if git diff --cached --quiet; then echo "No screenshot changes"; exit 0; fi
          git commit -m "SpeakerNotes docs: app screenshots"
          git push origin "HEAD:$GITHUB_HEAD_REF"
      - name: Publish the latest build as a release (main only, one zip, no sign-in needed)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=speakernotes-latest
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Info.plist)
          NOTES="Latest SpeakerNotes build from main, version $VERSION ($(git rev-parse --short HEAD)). Install or update with: curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/tools/speakernotes/install.sh | bash. Or download SpeakerNotes-macOS.zip, double-click it, and move SpeakerNotes.app to Applications. The app isn't notarized yet: the first time, right-click it and choose Open."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES" --target "$GITHUB_SHA" --prerelease=false
            git push -f origin "HEAD:refs/tags/$TAG"
          else
            gh release create "$TAG" --title "SpeakerNotes (latest build)" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" build/SpeakerNotes-macOS.zip --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: SpeakerNotes-macOS
          path: tools/speakernotes/build/SpeakerNotes-macOS.zip
