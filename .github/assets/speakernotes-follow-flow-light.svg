<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Keynote and PowerPoint: exact, SpeakerNotes asks the app which slide is up, so slide 7 goes to the notes headed 7. Google Slides, Canva and PDFs: SpeakerNotes reads the slide's title on your Mac and finds the notes heading with that title. Two-way: move the notes and your slides move too.">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker></defs><rect x="0.5" y="0.5" width="1199" height="150" rx="16" fill="#FFFFFF" stroke="#D0D7DE"/><text x="28" y="34" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#C2410C" letter-spacing="1.4">EXACT</text><text x="28" y="70" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#1F2328">Keynote and PowerPoint</text><text x="28" y="98" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#424A53">Asks the app which slide is up</text><rect x="500" y="52" width="250" height="44" rx="22" fill="#EAEEF2" stroke="#D0D7DE"/><text x="625.0" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2328">Slide 7</text><line x1="770" y1="74" x2="830" y2="74" stroke="#C2410C" stroke-width="3" marker-end="url(#ar)"/><rect x="850" y="52" width="322" height="44" rx="22" fill="#1C2533" stroke="#D0D7DE"/><text x="1011.0" y="80" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#FFD25C">## 7. Pricing</text><line x1="420" y1="74" x2="482" y2="74" stroke="#C2410C" stroke-width="3" marker-end="url(#ar)"/><rect x="0.5" y="170.5" width="1199" height="150" rx="16" fill="#FFFFFF" stroke="#D0D7DE"/><text x="28" y="204" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#C2410C" letter-spacing="1.4">READS THE HEADER</text><text x="28" y="240" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#1F2328">Google Slides, Canva, PDFs</text><text x="28" y="268" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#424A53">Reads the slide's title on your Mac</text><rect x="500" y="222" width="250" height="44" rx="22" fill="#EAEEF2" stroke="#D0D7DE"/><text x="625.0" y="250" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2328">“The agent loop”</text><line x1="770" y1="244" x2="830" y2="244" stroke="#C2410C" stroke-width="3" marker-end="url(#ar)"/><rect x="850" y="222" width="322" height="44" rx="22" fill="#1C2533" stroke="#D0D7DE"/><text x="1011.0" y="250" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#FFD25C">## The agent loop</text><line x1="420" y1="244" x2="482" y2="244" stroke="#C2410C" stroke-width="3" marker-end="url(#ar)"/><rect x="0.5" y="340.5" width="1199" height="79" rx="16" fill="#1C2533" stroke="#30363D"/><path d="M40,372 h44 l-8,-7 M84,372 l-8,7 M84,390 h-44 l8,-7 M40,390 l8,7" fill="none" stroke="#FF8A3D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="376" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" fill="#F0F3F6">Two-way</text><text x="110" y="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#C9D1D9">Move the notes with ⌃⌥→, and your slides move too. Press → in your slides, and the notes follow.</text>
</svg>
