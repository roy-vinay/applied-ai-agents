<svg xmlns="http://www.w3.org/2000/svg" width="480" height="224" viewBox="0 0 480 224" role="img" aria-label="Hide, don't detect: macOS has no public way to know a share started, so the notes are always private to capture. Nothing to remember. Always on, not switched on by a guess.">
